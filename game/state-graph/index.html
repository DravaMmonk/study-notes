<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="零基础动态规划解谜游戏：56 关从格子和箭头出发，用元件亲手拼出路线计数器、分层状态机、对齐表和背包表的电路，再用到博弈、语言、图片和强化学习上。">
<meta name="theme-color" content="#F3F1EB">
<title>状态之图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/wires.css">
<link rel="stylesheet" href="styles.css">
<script>try{const t=localStorage.getItem("fieldnotes.theme");document.documentElement.dataset.theme=["paper","night","blueprint"].includes(t)?t:matchMedia("(prefers-color-scheme: dark)").matches?"night":"paper"}catch(e){document.documentElement.dataset.theme="paper"}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <section id="map" class="screen">
    <div class="scroll">
      <div class="wrap gutter">
        <header class="hero">
          <div>
            <a class="hub" href="../">← 全部游戏</a>
            <div class="eyebrow">从零开始的动态规划解谜</div>
            <h1 class="title">状态之<em>图</em></h1>
            <p class="lede">不需要任何编程或算法基础。你只会拿到两种零件：格子和箭头。56 关里，你会用元件亲手拼出数路线、比文字、装背包的电路板，再把它们用到博弈、语言、图片和强化学习上，并且明白它们为什么这么快。</p>
          </div>
          <figure class="hero-fig">
            <div id="heroBoard"></div>
            <figcaption>每个格子 = 指向它的箭头送来的数之和。数从左上角流向右下角。</figcaption>
          </figure>
        </header>
        <div class="toolbar">
          <button class="pill" id="btnParts" type="button">零件箱 <b id="partCount"></b></button>
          <button class="pill" id="btnNotes" type="button">笔记本 <b id="noteCount"></b></button>
          <button class="pill icon" type="button" data-theme-toggle aria-label="主题"></button>
          <button class="pill icon" id="btnSettings" type="button" aria-label="设置"></button>
        </div>
        <div id="banner"></div>
        <div id="chapters" style="display:grid;gap:30px"></div>
        <p class="foot">设计思路借鉴《图灵完备》：从最小的零件出发，每一关只多一个新想法，前面拼好的电路板会变成后面的元件。</p>
      </div>
    </div>
  </section>

  <section id="level" class="screen" hidden>
    <header class="lv-top gutter">
      <button class="iconbtn" id="btnBack" type="button" aria-label="返回关卡地图"></button>
      <button class="iconbtn desk" id="btnRail" type="button" aria-label="关卡列表" aria-expanded="false"></button>
      <span class="brand desk"><i class="brand-chip"></i>状态之图</span>
      <div class="lv-titles"><div class="eyebrow" id="lvCh"></div><h2 id="lvTitle"></h2></div>
      <button class="introbtn" id="btnIntro" type="button">引入</button>
      <button class="iconbtn desk" type="button" data-theme-toggle aria-label="主题"></button>
    </header>
    <nav class="rail" id="rail" aria-label="关卡列表"></nav>
    <div class="rail-scrim" id="railScrim"></div>
    <div class="lv-scroll" id="lvScroll">
      <div class="lv-grid gutter">
        <aside class="brief" id="brief">
          <section class="mission" id="mission" aria-label="任务"></section>
          <section class="parts" id="parts" aria-label="元件" data-trash></section>
        </aside>
        <section class="bcard" id="bcard" aria-label="棋盘">
          <div class="tests" id="tests" role="tablist" aria-label="测试"></div>
          <div class="board" id="board"></div>
          <p class="bnote" id="bnote"></p>
          <div id="view"></div>
          <div id="after"></div>
        </section>
        <div class="panel" id="panel"></div>
      </div>
    </div>
    <footer class="dock gutter" id="dock"></footer>
  </section>
</div>

<div id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" id="grab"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
