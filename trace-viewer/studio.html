<!doctype html>
<!-- The studio (games/kit/studio), on the dev server only: npm run studio. With ?play it is the game played inside it. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23282824'/%3E%3Cpath d='M16 46 40 22l6 6-24 24h-6zM36 26l6 6' fill='none' stroke='%23fbfaf6' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Studio</title>
    <script>
      try {
        const saved = localStorage.getItem('fieldnotes.theme')
        document.documentElement.dataset.theme = ['paper', 'night', 'blueprint'].includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper'
      } catch {
        document.documentElement.dataset.theme = 'paper'
      }
      try {
        const saved = localStorage.getItem('fieldnotes.lang')
        document.documentElement.lang = saved === 'en' ? 'en' : 'zh-CN'
      } catch {
        document.documentElement.lang = 'zh-CN'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio.js"></script>
  </body>
</html>
