<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="零基础动态规划解谜游戏：23 关从格子和箭头出发，一路造出路线计数器、分层状态机、对齐表和背包表。">
<meta name="theme-color" content="#11151B">
<title>状态之图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: a night workbench — level map ⇄ level bench (mission card, board, parts panel, dock). One column on phones; board and panel side by side from 900px. Single deliberate dark theme. */
:root{
  --bg:#11151B; --panel:#181E26; --panel-2:#1F2630; --line:#2C3644; --board:#141920; --dot:rgba(150,170,200,.10);
  --chip:#222A35; --chip-line:#3A4656; --chip-lit:#29323F;
  --ink:#E8EDF3; --ink-2:#A6B2BF; --ink-3:#717E8D;
  --wire:#56647A; --wire-dim:#323C49;
  --signal:#F6B93E; --signal-ink:#1E1606; --signal-soft:rgba(246,185,62,.14);
  --cyan:#5EC8FF; --cyan-soft:rgba(94,200,255,.14);
  --good:#47D49F; --good-soft:rgba(71,212,159,.16); --bad:#FF6B5A; --bad-soft:rgba(255,107,90,.16);
  --t0:#F6B93E; --t1:#5EC8FF; --t2:#47D49F; --t3:#FF8A65; --t4:#B79CFF; --t5:#8FA1B5;
  --scrim:rgba(4,7,10,.7);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--cyan);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- board (svg) ---------- */
.board-svg{display:block}
.cell rect{fill:var(--chip);stroke:var(--chip-line);stroke-width:1.5;transition:fill .18s,stroke .18s}
.cell text{text-anchor:middle;pointer-events:none}
.cell .val{fill:var(--ink);font:700 21px var(--f-mono);dominant-baseline:central}
.cell .lb{fill:var(--ink-2);font:600 12.5px var(--f-body)}
.cell .cn{fill:var(--ink-3);font:600 11px var(--f-mono);text-anchor:start}
.cell .sb{fill:var(--cyan);font:700 11px var(--f-body)}
.cell.tap{cursor:pointer}
.cell.lit rect{fill:var(--chip-lit);stroke:var(--wire)}
.cell.house rect{fill:var(--panel-2);stroke:var(--line)}
.cell.house .val{fill:var(--signal)}
.cell.key rect{stroke:var(--signal);stroke-width:2.4}
.cell.key .lb{fill:var(--signal)}
.cell.door rect{stroke:var(--t3);stroke-width:2.4;stroke-dasharray:4 3}
.cell.door .lb{fill:var(--t3)}
.cell.ra rect{fill:var(--cyan-soft);stroke:var(--cyan);stroke-width:2.2}
.cell.rb rect{fill:var(--signal-soft);stroke:var(--signal);stroke-width:2.2}
.cell.rab rect{fill:var(--good-soft);stroke:var(--good);stroke-width:2.2}
.cell.ra .val{fill:var(--cyan)} .cell.rb .val{fill:var(--signal)} .cell.rab .val{fill:var(--good);font-size:15px}
.cell.eq .cn{fill:var(--cyan);font-size:13px}
.cell.tile .val{font-size:20px}
.cell.ghost{opacity:.42}
.cell.src rect{stroke:var(--signal);stroke-width:2.2}
.cell.src .val{fill:var(--signal)}
.cell.goal rect{stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 4}
.cell.sel rect{stroke:var(--cyan);stroke-width:3.2;stroke-dasharray:none;fill:var(--cyan-soft)}
.cell.pred rect{stroke:var(--signal);stroke-width:2.6;stroke-dasharray:4 3}
.cell.hot rect{fill:var(--signal);stroke:var(--signal)}
.cell.hot text{fill:var(--signal-ink)}
.cell.ok rect{stroke:var(--good);stroke-width:2.6;fill:var(--good-soft)}
.cell.bad rect{stroke:var(--bad);stroke-width:2.6;fill:var(--bad-soft)}
.cell.path rect{stroke:var(--good);stroke-width:2.6;fill:var(--good-soft)}
.cell.dimc{opacity:.38}
.cell.coach rect{animation:coach 1.2s ease-in-out infinite}
@keyframes coach{50%{stroke:var(--cyan);stroke-width:5}}
.cell.s0 rect{fill:var(--t0);stroke:none} .cell.s1 rect{fill:var(--t1);stroke:none} .cell.s2 rect{fill:var(--t2);stroke:none}
.cell.s3 rect{fill:var(--t3);stroke:none} .cell.s4 rect{fill:var(--t4);stroke:none} .cell.s5 rect{fill:var(--t5);stroke:none}
.cell.s0 .val,.cell.s1 .val,.cell.s2 .val,.cell.s3 .val,.cell.s4 .val,.cell.s5 .val{fill:#12161C;font-size:14px}
.edge{fill:none;stroke-width:2.2;stroke-linecap:round}
.edge.idle{stroke:var(--wire)} .edge.dim{stroke:var(--wire-dim);stroke-width:1.6}
.edge.sel{stroke:var(--cyan);stroke-width:2.8}
.edge.good{stroke:var(--good);stroke-width:3}
.edge.bad{stroke:var(--bad);stroke-width:2.8;stroke-dasharray:6 4}
.edge.hot{stroke:var(--signal);stroke-width:3.2;stroke-dasharray:8 6;animation:flow .55s linear infinite}
.edge.link{stroke:var(--cyan);stroke-width:3}
.edge.linkbad{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4}
.edge.ra{stroke:var(--cyan);stroke-width:3}
.edge.rb{stroke:var(--signal);stroke-width:3}
.tx{fill:var(--ink-3);font:600 12.5px var(--f-body)}
.tx.hd{fill:var(--ink-2);font:700 13px var(--f-body)}
.cell.axis rect{fill:none;stroke:none}
.cell.axis .val{fill:var(--cyan);font-size:19px}
.cell.axis.axis0 .val{fill:var(--ink-3);font:600 12px var(--f-body)}
.cell.axis.ok rect{fill:var(--good-soft);stroke:none}
.cell.axis.ok .val{fill:var(--good)}
@keyframes flow{to{stroke-dashoffset:-14}}

/* ---------- map ---------- */
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
.hero{display:grid;gap:22px}
.title{font:900 clamp(54px,17vw,108px)/.95 var(--f-display);letter-spacing:-.02em;margin:10px 0 14px}
.title em{font-style:normal;color:var(--signal)}
.lede{max-width:31em;color:var(--ink-2);font-size:16px;margin:0;text-wrap:pretty}
.hero-fig{margin:0;border-radius:20px;padding:12px;background:var(--board);border:1px solid var(--line);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero-fig figcaption{font:12px/1.5 var(--f-mono);color:var(--ink-3);margin:6px 4px 2px}
@media (min-width:860px){.hero{grid-template-columns:1.05fr .95fr;align-items:center}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.pill b{font:700 12px var(--f-mono);color:var(--signal)}
.pill.icon{width:44px;padding:0;justify-content:center}
.pill:active,.lcard:active{transform:scale(.98)}
.banner{display:grid;gap:4px;padding:16px 18px;border-radius:16px;background:var(--signal);color:var(--signal-ink)}
.banner b{font:900 20px var(--f-display)}
.chapter{display:grid;gap:12px}
.ch-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ch-head h2{margin:0;font:900 22px/1.3 var(--f-display)}
.ch-head p{margin:0;color:var(--ink-3);font-size:13.5px}
.ch-num{font:700 12px var(--f-mono);color:var(--signal);letter-spacing:.06em}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.lcard{position:relative;text-align:left;padding:14px 16px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;gap:4px;transition:transform .15s,border-color .2s}
.lcard:hover{border-color:var(--wire)}
.lcard .no{font:700 12px var(--f-mono);color:var(--ink-3)}
.lcard .tt{font:700 19px/1.3 var(--f-display)}
.lcard .ds{font-size:13.5px;color:var(--ink-2);text-wrap:pretty}
.lcard .st{position:absolute;top:12px;right:12px;font:700 11px var(--f-mono);padding:3px 7px;border-radius:6px}
.lcard.done .st{background:var(--good-soft);color:var(--good)}
.lcard.next{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal),0 10px 30px -14px rgba(246,185,62,.5)}
.lcard.next .st{background:var(--signal);color:var(--signal-ink)}
.lcard.locked{opacity:.45}
.lcard.locked .st{color:var(--ink-3)}
.lcard .pt{justify-self:start;margin-top:6px;font:600 11.5px var(--f-mono);padding:5px 8px;border-radius:7px;background:var(--signal-soft);color:var(--signal)}
.foot{margin:0;font-size:13px;color:var(--ink-3);max-width:40em}

/* ---------- level ---------- */
.lv-top{display:flex;align-items:center;gap:6px;padding-block:8px;background:var(--panel);border-bottom:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--panel-2)}
.lv-titles{min-width:0;flex:1}
.lv-titles h2{margin:1px 0 0;font:700 19px/1.25 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.introbtn{flex:none;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.lv-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lv-grid{max-width:1180px;margin:0 auto;padding-block:14px 24px;display:grid;gap:14px}
.lv-main,.lv-side{min-width:0;display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.lv-grid{grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);align-items:start;padding-block:20px 32px}.lv-side{position:sticky;top:20px}}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.mission p{margin:0;text-wrap:pretty}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.mrow .k{font:700 11.5px var(--f-mono);color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--cyan-soft);color:var(--ink);font-size:14px}
.tip b{font:700 11.5px var(--f-mono);color:var(--cyan);white-space:nowrap;margin-top:2px}
.bcard{background:var(--board);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;scroll-margin-top:10px}
.tests{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.tests::-webkit-scrollbar{display:none}
.tchip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:8px;font:600 12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.tchip[aria-selected="true"]{border-color:var(--ink-2);color:var(--ink)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--wire);flex:none}
.sd.pass{background:var(--good)} .sd.fail{background:var(--bad)} .sd.run{background:var(--signal)}
.board{overflow-x:auto;margin:0 -12px;padding:0 12px}
.board:empty{display:none}
.bnote{margin:0;font-size:13px;color:var(--ink-2);text-wrap:pretty;min-height:1.2em}
.panel{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.pcard h3{margin:0;font:700 16px var(--f-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard h3 small{font:600 11.5px var(--f-body);color:var(--ink-3)}
.pcard p{margin:0;font-size:14px;color:var(--ink-2);text-wrap:pretty}
.pcard p b{color:var(--ink)}
.rule{font:600 14px/1.6 var(--f-mono);color:var(--ink);background:var(--panel-2);border-radius:10px;padding:10px 12px}
.rule em{font-style:normal;color:var(--signal)}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--f-mono);padding:5px 8px;border-radius:7px;background:var(--signal-soft);color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{min-height:44px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);font-weight:600;font-size:14px;line-height:1.35;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s,background .15s,border-color .15s}
.chip:active:not(:disabled){transform:scale(.96)}
.chip[aria-checked="true"]{background:var(--cyan);border-color:var(--cyan);color:#06131C}
.chip.ghost{background:transparent}
.optlabel{font-weight:700;font-size:14px}
.opthint{font-size:13px;color:var(--ink-3)}

.stencil{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}
.stencil.strip{grid-template-columns:repeat(5,minmax(0,64px))}
.sb-btn{height:64px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;display:grid;place-items:center;gap:0;padding:4px 0;font:600 11.5px var(--f-body);color:var(--ink-3);transition:background .15s,border-color .15s,color .15s,transform .12s}
.sb-btn .ar{font:700 20px/1 var(--f-mono);color:var(--wire)}
.sb-btn[aria-pressed="true"]{border-style:solid;border-color:var(--signal);background:var(--signal-soft);color:var(--ink)}
.sb-btn[aria-pressed="true"] .ar{color:var(--signal)}
.sb-btn:active:not(:disabled){transform:scale(.95)}
.sb-btn:disabled{cursor:default}
.sb-mid{height:64px;border-radius:12px;background:var(--cyan-soft);border:2px solid var(--cyan);display:grid;place-items:center;font:700 13px var(--f-body);color:var(--cyan)}
.routes{display:grid;gap:6px}
.route{font:600 13px var(--f-mono);padding:8px 10px;border-radius:9px;background:var(--good-soft);color:var(--good);overflow-wrap:anywhere}
.route.now{background:var(--cyan-soft);color:var(--cyan)}
.route.empty{background:var(--panel-2);color:var(--ink-3)}
.msg{padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:14px;color:var(--ink-2)}
.msg.good{background:var(--good-soft);color:var(--ink)}
.msg.bad{background:var(--bad-soft);color:var(--ink)}
.msg b{color:var(--ink);font-family:var(--f-mono)}
.range{width:100%;accent-color:var(--signal);height:32px}
.bignum{font:700 clamp(30px,9vw,42px)/1 var(--f-mono);font-variant-numeric:tabular-nums}
.duo{display:grid;gap:12px}
@media (min-width:640px){.duo{grid-template-columns:1fr 1fr}}
.duo section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.duo h4{margin:0;font:700 15px var(--f-display)}
.duo .k{font:600 11.5px var(--f-mono);color:var(--ink-3)}
.duo .slow .bignum{color:var(--bad)} .duo .fast .bignum{color:var(--good)}
.toolarge{padding:18px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-3);font-size:13.5px;text-align:center}

.dock{background:var(--panel);border-top:1px solid var(--line);padding-block:10px}
.dock-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dmeta{font:600 12.5px/1.4 var(--f-mono);color:var(--ink-3);min-width:0;flex:1}
.dmeta b{color:var(--ink)}
.go{flex:none;min-height:52px;min-width:min(180px,48vw);padding:0 22px;border-radius:15px;background:var(--signal);color:var(--signal-ink);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16px;transition:transform .12s,background .2s}
.go:active{transform:scale(.97)}
.go.busy{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.go.pulse{animation:pulse 1.2s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--signal)}70%,100%{box-shadow:0 0 0 12px transparent}}
.sec-btn{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-weight:600;font-size:14px}
.pad{max-width:520px;margin:0 auto;width:100%;display:grid;gap:8px}
.pad-top{display:flex;align-items:center;gap:10px}
.pad-top span{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}
.pad-top b{color:var(--ink)}
.pad-val{min-width:76px;text-align:center;font:700 24px/44px var(--f-mono);background:var(--board);border:1.5px solid var(--cyan);border-radius:12px;color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key{min-height:46px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font:700 19px var(--f-mono)}
.key:active{background:var(--chip-lit)}
.key.wide{grid-column:span 2;font:700 15px var(--f-body)}
.key.ok{background:var(--cyan);border-color:var(--cyan);color:#06131C;font:800 15px var(--f-body)}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s}
.sheet{--off:100%;--dy:0px;--tx:0px;position:absolute;left:0;right:0;bottom:0;max-height:min(92%,820px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -16px 50px -20px rgba(0,0,0,.8);transform:translate(var(--tx),calc(var(--off) + var(--dy)));transition:transform .36s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open .scrim{opacity:1}
#sheet.open .sheet{--off:0%}
.sheet.dragging{transition:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:620px;--tx:-50%}}
.grab{flex:none;height:30px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:42px;height:5px;border-radius:3px;background:var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding-top:2px;padding-bottom:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.kicker{font:700 12px var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.kicker.good{color:var(--good)} .kicker.bad{color:var(--bad)} .kicker.sig{color:var(--signal)}
.sh{margin:4px 0 0;font:900 25px/1.3 var(--f-display);text-wrap:balance}
.prose{display:grid;gap:10px}
.prose p{margin:0;color:var(--ink-2);font-size:15.5px;text-wrap:pretty}
.prose p b{color:var(--ink)}
.prose p strong{color:var(--signal);font-weight:700}
.fig{border-radius:16px;background:var(--board);border:1px solid var(--line);padding:10px;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.fig svg{max-height:240px;margin:0 auto}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{width:20px;border-radius:4px;background:var(--signal)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;min-height:50px;border-radius:14px;font-weight:700;padding:0 18px}
.btn.pri{background:var(--signal);color:var(--signal-ink)}
.btn.sec{border:1px solid var(--line)}
.btn:disabled{opacity:.35}

<script>
'use strict';

/* ================= core rules ================= */

const OPS = { sum: a => a.reduce((s, x) => s + x, 0), min: a => Math.min(...a), max: a => Math.max(...a) };
const fmt = v => v === Infinity ? '∞' : v === -Infinity ? '✗' : typeof v === 'number' ? v.toLocaleString('en-US') : v == null ? '' : String(v);

function evalGraph(cells, edges) {
  const ids = cells.map(c => c.id), indeg = {}, out = {};
  ids.forEach(i => { indeg[i] = 0; out[i] = []; });
  edges.forEach(([a, b]) => { indeg[b]++; out[a].push(b); });
  const queue = ids.filter(i => indeg[i] === 0), order = [];
  while (queue.length) { const v = queue.shift(); order.push(v); out[v].forEach(w => { if (--indeg[w] === 0) queue.push(w); }); }
  if (order.length < ids.length) return { cycle: ids.filter(i => !order.includes(i)) };
  const by = Object.fromEntries(cells.map(c => [c.id, c])), val = {}, steps = [];
  for (const v of order) {
    const ins = edges.filter(e => e[1] === v);
    val[v] = by[v].fixed !== undefined ? by[v].fixed : ins.reduce((s, [a]) => s + val[a], 0);
    steps.push({ id: v, ins, v: val[v] });
  }
  return { val, steps, order };
}

function allRoutes(start, end, edges) {
  const out = {}, res = [];
  edges.forEach(([a, b]) => (out[a] = out[a] || []).push(b));
  (function go(v, path) { if (v === end) { res.push(path); return; } (out[v] || []).forEach(w => go(w, [...path, w])); })(start, [start]);
  return res;
}

const STENCIL_GRID = {
  ul: { d: [-1, -1], l: '左上', ar: '↘' }, u: { d: [-1, 0], l: '上面', ar: '↓' }, ur: { d: [-1, 1], l: '右上', ar: '↙' },
  l: { d: [0, -1], l: '左边', ar: '→' }, r: { d: [0, 1], l: '右边', ar: '←' },
  dl: { d: [1, -1], l: '左下', ar: '↗' }, d: { d: [1, 0], l: '下面', ar: '↑' }, dr: { d: [1, 1], l: '右下', ar: '↖' },
};
const STENCIL_STRIP = { m3: { d: -3, l: 'i − 3' }, m2: { d: -2, l: 'i − 2' }, m1: { d: -1, l: 'i − 1' }, p1: { d: 1, l: 'i + 1' } };
const ORDERS = {
  rowTL: { l: '逐行，从左上开始', list: (R, C) => { const o = []; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) o.push([r, c]); return o; } },
  rowBR: { l: '逐行，从右下开始', list: (R, C) => ORDERS.rowTL.list(R, C).reverse() },
  colL: { l: '逐列，从左往右', list: (R, C) => { const o = []; for (let c = 0; c < C; c++) for (let r = 0; r < R; r++) o.push([r, c]); return o; } },
  colR: { l: '逐列，从右往左', list: (R, C) => { const o = []; for (let c = C - 1; c >= 0; c--) for (let r = 0; r < R; r++) o.push([r, c]); return o; } },
};

function worldCells(w) {
  if (w.kind === 'strip') return Array.from({ length: w.n + 1 }, (_, i) => ({ id: String(i), i, start: i === 0, end: i === w.n }));
  const rocks = new Set((w.rocks || []).map(p => p.join(','))), out = [];
  for (let r = 0; r < w.R; r++) for (let c = 0; c < w.C; c++) {
    out.push({ id: `${r},${c}`, r, c, rock: rocks.has(`${r},${c}`), cost: w.costs ? w.costs[r][c] : null, start: r === 0 && c === 0, end: r === w.R - 1 && c === w.C - 1 });
  }
  return out;
}
function neighborId(w, cell, key) {
  if (w.kind === 'strip') { const j = cell.i + STENCIL_STRIP[key].d; return j >= 0 && j <= w.n ? String(j) : null; }
  const [dr, dc] = STENCIL_GRID[key].d, r = cell.r + dr, c = cell.c + dc;
  return r >= 0 && r < w.R && c >= 0 && c < w.C ? `${r},${c}` : null;
}
function runMachine(w, rule) {
  const cells = worldCells(w), by = Object.fromEntries(cells.map(c => [c.id, c]));
  const order = w.kind === 'strip' ? cells : ORDERS[rule.order].list(w.R, w.C).map(([r, c]) => by[`${r},${c}`]);
  const val = new Map(), steps = [];
  for (const cell of order) {
    let ins = [], v;
    if (cell.rock && rule.rock === 'zero') v = 0;
    else if (cell.start) v = rule.start + (rule.addCost ? cell.cost : 0);
    else {
      ins = rule.stencil.map(k => neighborId(w, cell, k)).filter(Boolean);
      const missing = ins.filter(id => !val.has(id));
      if (missing.length) { steps.push({ id: cell.id, ins, missing, err: true }); return { error: { cell, missing }, steps, val }; }
      v = ins.length ? OPS[rule.op](ins.map(id => val.get(id))) : 0;
      if (rule.addCost) v += cell.cost;
    }
    val.set(cell.id, v);
    steps.push({ id: cell.id, ins, v });
  }
  return { value: val.get(cells.find(c => c.end).id), steps, val };
}
function askCalls(n) { const c = [1, 2]; for (let i = 2; i <= n; i++) c[i] = 1 + c[i - 1] + c[i - 2]; return c[n]; }
function buildTree(n) {
  const nodes = [];
  let leaf = 0, depth = 0;
  (function rec(i, d, parent) {
    const nd = { i, d, parent, x: 0 };
    nodes.push(nd);
    depth = Math.max(depth, d);
    const kids = [i - 1, i - 2].filter(j => j >= 0 && i > 0).map(j => rec(j, d + 1, nd));
    nd.x = kids.length ? (kids[0].x + kids[kids.length - 1].x) / 2 : leaf++;
    return nd;
  })(n, 0, null);
  return { nodes, leaves: leaf, depth };
}

/* ================= scene builders ================= */

const N = (id, x, y, o = {}) => ({ id, x, y, w: o.w || 84, h: o.h || 64, label: o.label, value: o.value ?? '', corner: o.corner, sub: o.sub, cls: o.cls || '' });
const E = (a, b, cls = 'idle', bend = 0, off = 0) => ({ a, b, cls, bend, off });
function gridScene(R, C, opt = {}) {
  const sp = opt.sp || 66, sz = opt.sz || 56, cells = [], edges = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const id = `${r},${c}`, o = (opt.cell && opt.cell(r, c)) || {};
    cells.push({ id, x: c * sp, y: r * sp, w: sz, h: sz, value: o.value ?? '', corner: o.corner, label: o.label, cls: o.cls || '' });
    if (opt.arrows !== false) {
      if (c + 1 < C) edges.push(E(id, `${r},${c + 1}`, (opt.edge && opt.edge(id, `${r},${c + 1}`)) || 'dim'));
      if (r + 1 < R) edges.push(E(id, `${r + 1},${c}`, (opt.edge && opt.edge(id, `${r + 1},${c}`)) || 'dim'));
    }
  }
  return { cells, edges };
}
function treeScene(n) {
  const t = buildTree(n), sp = 34, cells = t.nodes.map((nd, k) => ({ id: `t${k}`, x: nd.x * sp, y: nd.d * 50, w: 28, h: 28, value: nd.i, cls: `s${nd.i % 6}`, rx: 14 }));
  const edges = t.nodes.map((nd, k) => (nd.parent ? E(`t${t.nodes.indexOf(nd.parent)}`, `t${k}`, 'dim') : null)).filter(Boolean);
  return { cells, edges };
}

/* ================= levels ================= */

const CHAPTERS = [
  { name: '格子与箭头', desc: '这台机器只有两种零件。' },
  { name: '数路线', desc: '用小问题的答案，拼出大问题的答案。' },
  { name: '造一台机器', desc: '把重复的计算交给印章。' },
  { name: '先后顺序', desc: '格子要等它需要的格子先算好。' },
  { name: '最好的选择', desc: '从数路线，到找最好的那条路。' },
  { name: '为什么这么快', desc: '记下来，不重复。' },
  { name: '状态不够用', desc: '一个数记不住的时候，就多记一件事。' },
  { name: '两串文字', desc: '一个词放上面，一个词放左边。' },
  { name: '装背包', desc: '容量有限时，拿还是不拿。' },
  { name: '毕业', desc: '认出伪装起来的老朋友。' },
];

const PARTS = {

      cells.push({ id: cid, x: c * sp, y: layerY(L) + r * sp, w: sz, h: sz, value: shown.has(cid) ? shown.get(cid) : '', label: id === kid ? '钥匙' : doors.has(id) ? '门' : '', corner: id === '0,0' ? '起' : id === end ? '终' : '', cls: cls.filter(Boolean).join(' ') });
      const into = (to, cls2) => edges.push(E(cid, `${L}:${to}`, cls2));
      if (c + 1 < t.C) into(`${r},${c + 1}`, running && s.L === L && s.id === `${r},${c + 1}` ? 'hot' : 'dim');
      if (r + 1 < t.R) into(`${r + 1},${c}`, running && s.L === L && s.id === `${r + 1},${c}` ? 'hot' : 'dim');
    }
  });
  if (cfg.key === 'move') {
    const kr = t.key[0], x0 = t.key[1] * sp - sz / 2, xl = -sz / 2 - 26, hot = running && s.xfer;
    paths.push({ d: `M${x0 - 2} ${layerY(0) + kr * sp} H${xl} V${layerY(1) + kr * sp} H${x0 - 7}`, cls: hot ? 'hot' : 'sel', box: [xl - 4, layerY(0) + kr * sp, x0, layerY(1) + kr * sp] });
  }
  return { cells, edges, texts, paths };
}

function alignScene(top, left, view, o = {}) {
  const sp = 52, sz = 44, cells = [], edges = [];
  const { steps, k, s, done } = viewParts(view), running = s && !done;
  const shown = new Map(steps.slice(0, k).map(x => [`${x.i},${x.j}`, x.v]));
  const path = new Set((o.path || []).map(p => p.join(','))), okT = o.okTop || new Set(), okL = o.okLeft || new Set();
  for (let j = 0; j <= top.length; j++) cells.push({ id: `t${j}`, x: j * sp, y: -sp + 10, w: sz, h: 32, value: j ? top[j - 1] : '空', cls: `axis${j ? '' : ' axis0'}${okT.has(j - 1) ? ' ok' : ''}` });
  for (let i = 0; i <= left.length; i++) cells.push({ id: `l${i}`, x: -sp + 8, y: i * sp, w: 32, h: sz, value: i ? left[i - 1] : '空', cls: `axis${i ? '' : ' axis0'}${okL.has(i - 1) ? ' ok' : ''}` });
  for (let i = 0; i <= left.length; i++) for (let j = 0; j <= top.length; j++) {
    const id = `${i},${j}`, eq = i && j && top[j - 1] === left[i - 1], active = running && s.i === i && s.j === j, feed = running && s.ins.some(p => p[0] === i && p[1] === j);
    const cls = [eq ? 'eq' : '', active ? 'hot' : '', feed ? 'pred' : '', shown.has(id) && !active ? 'lit' : '', done && path.has(id) ? 'path' : '', done && i === left.length && j === top.length ? (view.pass ? 'ok' : 'bad') : ''];
    cells.push({ id, x: j * sp, y: i * sp, w: sz, h: sz, value: shown.has(id) ? shown.get(id) : '', corner: eq ? '=' : '', cls: cls.filter(Boolean).join(' ') });
  }
  if (running) s.ins.forEach(([y, x]) => edges.push(E(`${y},${x}`, `${s.i},${s.j}`, 'hot')));
  if (done && o.path) for (let q = 0; q + 1 < o.path.length; q++) edges.push(E(o.path[q + 1].join(','), o.path[q].join(','), 'good'));
  return { cells, edges };
}

function knapScene(t, cfg, view) {
  const W = t.W, sp = 50, sz = 44, cells = [], edges = [], texts = [{ x: -sz / 2 - 10, y: -sp + 19, t: '容量', anchor: 'end' }];
  const { steps, k, s, done } = viewParts(view), running = s && !done;
  const shown = new Map(steps.slice(0, k).map(x => [`${x.i},${x.w}`, x.v]));
  const path = new Set(done && view.pass ? view.res.cells.map(p => p.join(',')) : []);
  for (let w = 0; w <= W; w++) cells.push({ id: `ax${w}`, x: w * sp, y: -sp + 14, w: sz, h: 26, value: w, cls: 'axis' });
  ['不放东西', ...t.items.map(it => `${it.n} ${it.w}kg · ${it.v}`)].forEach((lb, i) => {
    texts.push({ x: -sz / 2 - 10, y: i * sp + 5, t: lb, anchor: 'end', cls: running && s.i === i ? 'hd' : '' });
    for (let w = 0; w <= W; w++) {
      const id = `${i},${w}`, active = running && s.i === i && s.w === w, feed = running && s.ins.some(p => p[0] === i && p[1] === w);
      const cls = [active ? 'hot' : '', feed ? 'pred' : '', shown.has(id) && !active ? 'lit' : '', path.has(id) ? 'path' : '', done && i === t.items.length && w === W ? (view.pass ? 'ok' : 'bad') : ''];
      cells.push({ id, x: w * sp, y: i * sp, w: sz, h: sz, value: shown.has(id) ? shown.get(id) : '', cls: cls.filter(Boolean).join(' ') });
    }
  });
  if (running) s.ins.forEach((p, q) => edges.push(E(p.join(','), `${s.i},${s.w}`, s.kinds[q] === 'rowk' ? 'bad' : 'hot', s.kinds[q] === 'rowk' ? -34 : 0)));
  return { cells, edges, texts };
}

function rollScene(t, cfg, view) {
  const W = t.W, sp = 50, sz = 44, rowH = 60, cells = [], edges = [], texts = [{ x: -sz / 2 - 10, y: -sp + 19, t: '容量 w', anchor: 'end' }];
  const { steps, k, s, done } = viewParts(view), running = s && !done;
  for (let w = 0; w <= W; w++) cells.push({ id: `ax${w}`, x: w * sp, y: -sp + 14, w: sz, h: 26, value: w, cls: 'axis' });
  const rows = [];
  if (!view) rows.push({ lb: 'dp · 初始', vals: Array(W + 1).fill(0) });
  else {
    const ai = done ? t.items.length : s ? s.item : 0;
    rows.push({ lb: '初始', vals: view.res.snaps[0], ghost: true });
    for (let j = 0; j < ai; j++) rows.push({ lb: `拿完${t.items[j].n}`, vals: view.res.snaps[j + 1], ghost: true });
    if (running) rows.push({ lb: `正在处理${t.items[ai].n}`, vals: s.row, cur: true });
    else if (done) rows[rows.length - 1] = { ...rows[rows.length - 1], ghost: false, final: true };
  }
  const touched = running ? new Set(steps.slice(0, k - 1).filter(x => x.item === s.item).map(x => x.w)) : new Set();
  rows.forEach((row, r) => {
    texts.push({ x: -sz / 2 - 10, y: r * rowH + 5, t: row.lb, anchor: 'end', cls: row.cur || row.final ? 'hd' : '' });
    row.vals.forEach((v, w) => {
      let cls = row.ghost ? 'ghost' : 'lit';
      if (row.cur) cls = w === s.w ? 'hot' : w === s.src ? (s.reused ? 'bad' : 'pred') : touched.has(w) ? 'lit' : '';
      if (row.final && w === W) cls = view.pass ? 'ok' : 'bad';
      cells.push({ id: `${r}:${w}`, x: w * sp, y: r * rowH, w: sz, h: sz, value: v, cls });
    });
    if (row.cur) edges.push(E(`${r}:${s.src}`, `${r}:${s.w}`, s.reused ? 'bad' : 'hot', -36));
  });
  return { cells, edges, texts };
}

function robConflict(a) {
  const tile = (j, on, ask) => `<span class="hs${on ? ' on' : ''}${ask ? ' ask' : ''}">${a[j]}<small>${j + 1}号</small></span>`;
  return `<div class="cx"><div class="kicker bad">反例</div>
    <p class="cx-p">看第 1 条街的前两家。下面两段历史走到 2 号时，在一层的机器里落进<b>同一个格子</b>：</p>
    <div class="cx-row"><header><b>历史 A</b><span>偷了 2 号 · 共 ${a[1]}</span></header><div class="houses">${tile(0)}${tile(1, true)}<span class="arrow">→</span>${tile(2, false, true)}</div><span class="verdict no">不能偷 3 号：它和 2 号相邻</span></div>
    <div class="cx-row"><header><b>历史 B</b><span>偷了 1 号 · 共 ${a[0]}</span></header><div class="houses">${tile(0, true)}${tile(1)}<span class="arrow">→</span>${tile(2, false, true)}</div><span class="verdict yes">可以偷 3 号：${a[0]} + ${a[2]} = ${a[0] + a[2]}</span></div>
    <p class="cx-p">一个格子只能存一个数。它记住了更大的 ${a[1]}（历史 A），就忘掉了历史 B。可走到 3 号时，最好的 ${a[0] + a[2]} 恰恰来自 B。<b>要让机器分清 A 和 B，格子得多记一件事：这家偷没偷。</b></p></div>`;
}

/* ================= svg board ================= */

let svgSeq = 0;
const f1 = v => Math.round(v * 10) / 10;
function clipPt(c, tx, ty, gap) {
  const dx = tx - c.x, dy = ty - c.y;
  const s = Math.min(dx ? (c.w / 2 + gap) / Math.abs(dx) : Infinity, dy ? (c.h / 2 + gap) / Math.abs(dy) : Infinity);
  return [c.x + dx * s, c.y + dy * s];
}
function edgeSVG(A, B, e, twin, uid) {
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, off = twin ? 7 : e.off || 0;
  const a = { ...A, x: A.x + nx * off, y: A.y + ny * off }, b = { ...B, x: B.x + nx * off, y: B.y + ny * off };
  let d;
  if (e.bend) {
    const mx = (a.x + b.x) / 2 + nx * e.bend, my = (a.y + b.y) / 2 + ny * e.bend;
    const [sx, sy] = clipPt(a, mx, my, 2), [tx, ty] = clipPt(b, mx, my, 5);
    d = `M${f1(sx)} ${f1(sy)}Q${f1(mx)} ${f1(my)} ${f1(tx)} ${f1(ty)}`;
  } else {
    const [sx, sy] = clipPt(a, b.x, b.y, 2), [tx, ty] = clipPt(b, a.x, a.y, 5);
    d = `M${f1(sx)} ${f1(sy)}L${f1(tx)} ${f1(ty)}`;
  }
  return `<path class="edge ${e.cls}" d="${d}"${MARKED.has(e.cls) ? ` marker-end="url(#${uid}-${e.cls})"` : ''}/>`;
}
const MARKED = new Set(['idle', 'dim', 'hot', 'sel', 'bad', 'good', 'ra', 'rb']);
const textW = s => [...String(s)].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 13 : 7.5), 0);
function cellSVG(c, uid) {
  const hw = c.w / 2, hh = c.h / 2, cls = c.cls || '', rock = cls.includes('rock');
  const tap = c.tap ? ` data-cell="${c.id}" role="button" tabindex="0" aria-label="${c.aria || c.label || c.id}"` : '';
  const valY = c.label ? (c.sub ? 3 : 8) : 0;
  return `<g class="cell ${cls}${c.tap ? ' tap' : ''}"${tap} transform="translate(${c.x} ${c.y})">
    <rect x="${-hw}" y="${-hh}" width="${c.w}" height="${c.h}" rx="${c.rx ?? 12}"${rock ? ` style="fill:url(#${uid}-hatch)"` : ''}/>
    ${c.label ? `<text class="lb" y="${-hh + 17}">${c.label}</text>` : ''}
    ${c.corner !== undefined && c.corner !== null && c.corner !== '' ? `<text class="cn" x="${-hw + 6}" y="${-hh + 14}">${c.corner}</text>` : ''}
    <text class="val" y="${valY}">${fmt(c.value)}</text>
    ${c.sub ? `<text class="sb" y="${hh - 10}">${c.sub}</text>` : ''}
  </g>`;
}
function sceneSVG(scene, opt = {}) {
  const uid = `b${++svgSeq}`, pad = opt.pad ?? 14, cells = scene.cells, edges = scene.edges || [];
  const by = Object.fromEntries(cells.map(c => [c.id, c]));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of cells) { x0 = Math.min(x0, c.x - c.w / 2); x1 = Math.max(x1, c.x + c.w / 2); y0 = Math.min(y0, c.y - c.h / 2); y1 = Math.max(y1, c.y + c.h / 2); }
  for (const e of edges) if (e.bend) { const my = (by[e.a].y + by[e.b].y) / 2 + e.bend * 0.55; y0 = Math.min(y0, my - 4); y1 = Math.max(y1, my + 4); }
  for (const t of scene.texts || []) {
    const w = textW(t.t), a = t.anchor || 'middle', lx = a === 'end' ? t.x - w : a === 'start' ? t.x : t.x - w / 2;
    x0 = Math.min(x0, lx); x1 = Math.max(x1, lx + w); y0 = Math.min(y0, t.y - 14); y1 = Math.max(y1, t.y + 5);
  }
  for (const p of scene.paths || []) if (p.box) { x0 = Math.min(x0, p.box[0]); y0 = Math.min(y0, p.box[1]); x1 = Math.max(x1, p.box[2]); y1 = Math.max(y1, p.box[3]); }
  const pathSVG = (scene.paths || []).map(p => `<path class="edge ${p.cls}" d="${p.d}"${MARKED.has(p.cls) ? ` marker-end="url(#__UID__-${p.cls})"` : ''}/>`).join('');
  const textSVG = (scene.texts || []).map(t => `<text class="tx ${t.cls || ''}" x="${t.x}" y="${t.y}" text-anchor="${t.anchor || 'middle'}">${t.t}</text>`).join('');
  const pairs = new Set(edges.map(e => `${e.a}>${e.b}`));
  const vw = x1 - x0 + 2 * pad, vh = y1 - y0 + 2 * pad;
  const mk = (n, col) => `<marker id="${uid}-${n}" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0.5L10 5L0 9.5z" style="fill:${col}"/></marker>`;
  const defs = `<defs>${mk('idle', 'var(--wire)')}${mk('dim', 'var(--wire-dim)')}${mk('hot', 'var(--signal)')}${mk('sel', 'var(--cyan)')}${mk('bad', 'var(--bad)')}${mk('good', 'var(--good)')}${mk('ra', 'var(--cyan)')}${mk('rb', 'var(--signal)')}
    <pattern id="${uid}-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" style="fill:var(--chip)"/><rect width="3" height="8" style="fill:var(--wire)"/></pattern></defs>`;
  const minW = opt.minScale ? `min-width:${Math.round(vw * opt.minScale)}px;` : '';
  const maxW = opt.maxScale ? `max-width:${Math.round(vw * opt.maxScale)}px;margin:0 auto;` : '';
  return `<svg class="board-svg" viewBox="${f1(x0 - pad)} ${f1(y0 - pad)} ${f1(vw)} ${f1(vh)}" width="100%" style="${minW}${maxW}" role="img" aria-label="${opt.label || '示意图'}">${defs}<g>${edges.map(e => edgeSVG(by[e.a], by[e.b], e, pairs.has(`${e.b}>${e.a}`), uid)).join('')}</g><g>${cells.map(c => cellSVG(c, uid)).join('')}</g>${pathSVG.replaceAll('__UID__', uid)}${textSVG}</svg>`;
}

const Anim = {
  skipping: false, wake: null,
  begin() { this.skipping = false; },
  skip() { this.skipping = true; if (this.wake) this.wake(); },
  wait(ms) {
    if (this.skipping || reduced()) return Promise.resolve();
    return new Promise(res => { const t = setTimeout(() => { this.wake = null; res(); }, ms); this.wake = () => { clearTimeout(t); this.wake = null; res(); }; });

};

/* ================= mode: wire ================= */

function wireMode(L, saved) {
  const st = { edges: saved && saved.edges ? saved.edges : [], sel: null, vals: null, cur: null, hot: [], cycle: null };
  const by = Object.fromEntries(L.cells.map(c => [c.id, c]));
  const has = (a, b) => st.edges.some(e => e[0] === a && e[1] === b);
  const reset = () => { st.vals = null; st.cur = null; st.hot = []; st.cycle = null; };
  return {
    st,
    save: () => ({ edges: st.edges }),
    tip: () => (L.coach ? L.coach(st) : null),
    scene() {
      const coach = L.coach ? L.coach(st).cell : null;
      const cells = L.cells.map(c => {
        const src = c.fixed !== undefined, v = src ? c.fixed : st.vals && c.id in st.vals ? st.vals[c.id] : '·';
        const cls = [src ? 'src' : '', c.goal !== undefined ? 'goal' : '', st.sel === c.id ? 'sel' : '', st.cur === c.id ? 'hot' : '', st.vals && !src && st.cur !== c.id && c.id in st.vals ? 'lit' : '', st.cycle && st.cycle.includes(c.id) ? 'bad' : '', coach === c.id ? 'coach' : ''];
        return { id: c.id, x: c.x, y: c.y, w: 92, h: 76, label: c.label, value: v, sub: c.goal !== undefined ? `需要 ${c.goal}` : '', cls: cls.filter(Boolean).join(' '), tap: true, aria: `${c.label}格子` };
      });
      const edges = st.edges.map(([a, b]) => E(a, b, st.hot.some(e => e[0] === a && e[1] === b) ? 'hot' : st.cycle && st.cycle.includes(a) && st.cycle.includes(b) ? 'bad' : 'idle'));
      return { cells, edges };
    },
    note: () => st.sel ? `已选中「${by[st.sel].label}」。再点另一个格子连箭头，或者再点它一次取消选中。` : st.edges.length ? `已连 ${st.edges.length} 根箭头。` : '还没有箭头。',
    onCell(id) {
      if (cur.running) return;
      if (!st.sel) st.sel = id;
      else if (st.sel === id) st.sel = null;
      else {
        if (by[id].fixed !== undefined) { toast('源格子里的数是固定的，不能往里连箭头'); buzz(20); st.sel = null; }
        else {
          const a = st.sel;
          if (has(a, id)) { st.edges = st.edges.filter(e => !(e[0] === a && e[1] === id)); toast('拆掉了一根箭头'); }
          else st.edges = [...st.edges, [a, id]];
          st.sel = null;
          reset();
          buzz(10);
        }
      }
      persist();
      refresh();
    },
    panel() {
      return `<div class="pcard"><h3>规则</h3><div class="rule">格子里的数 = 所有指向它的箭头送来的数之和<br><em>没有箭头指向的格子 = 0</em></div></div>
        <div class="pcard"><h3>箭头<small>${st.edges.length} 根</small></h3>
          ${st.edges.length ? `<div class="routes">${st.edges.map(([a, b]) => `<div class="route now">${by[a].label} → ${by[b].label}</div>`).join('')}</div>` : '<p>还没有箭头。点一个格子，再点另一个格子。</p>'}
          <button class="sec-btn" type="button" data-act="clear" ${st.edges.length ? '' : 'disabled'}>拆掉全部箭头</button></div>`;
    },
    dock: () => ({ meta: `${L.cells.filter(c => c.goal !== undefined).map(c => `目标需要 <b>${c.goal}</b>`).join(' · ')}`, go: '运行', act: 'run' }),
    act(name) {
      if (name === 'clear') { st.edges = []; st.sel = null; reset(); persist(); refresh(); }
      if (name === 'run') this.run();
    },
    async run() {
      st.sel = null;
      reset();
      const res = evalGraph(L.cells, st.edges);
      if (res.cycle) {
        st.cycle = res.cycle;
        refresh();
        fail({ head: '箭头绕成了圈', body: `这几个格子互相等着对方先算：${res.cycle.map(id => `「${by[id].label}」`).join('、')}。谁也算不出来，机器停住了。拆掉其中一根箭头试试。` });
        return;
      }
      startRun();
      st.vals = {};
      for (const s of res.steps) {
        st.vals[s.id] = s.v;
        if (by[s.id].fixed !== undefined) continue;
        st.cur = s.id;
        st.hot = s.ins;
        renderBoard();
        await Anim.wait(700);

      st.cur = null; st.hot = [];
      endRun();
      refresh();
