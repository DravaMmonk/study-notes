      if (!wrong.length) pass();
      else {
        const c = wrong[0];
        fail({ head: `目标得到了 ${res.val[c.id]}`, body: `目标格子需要 <b>${c.goal}</b>，现在收到的是 <b>${res.val[c.id]}</b>。${res.val[c.id] === 0 ? '它没有收到任何箭头。' : '数一数，有哪些箭头指向了它？'}` });
      }
    },
  };
}

/* ================= mode: trace ================= */

function traceMode(L, saved) {
  const st = { route: [], found: saved && saved.found ? saved.found : [], flash: null };
  const by = Object.fromEntries(L.cells.map(c => [c.id, c])), total = allRoutes(L.start, L.end, L.edges).length;
  const has = (a, b) => L.edges.some(e => e[0] === a && e[1] === b);
  const name = id => by[id].label;
  return {
    st,
    save: () => ({ found: st.found }),
    scene() {
      const showRoute = st.route.length ? st.route : st.flash || [];
      const cells = L.cells.map(c => {
        const k = showRoute.indexOf(c.id);
        const cls = [k >= 0 ? (st.route.length ? 'sel' : 'path') : '', c.id === L.start && !st.route.length ? 'coach' : ''];
        return { id: c.id, x: c.x, y: c.y, w: 92, h: 66, label: c.label, value: k >= 0 ? k + 1 : '', cls: cls.filter(Boolean).join(' '), tap: true };
      });
      const onRoute = (a, b) => { const i = showRoute.indexOf(a); return i >= 0 && showRoute[i + 1] === b; };
      const edges = L.edges.map(([a, b]) => E(a, b, onRoute(a, b) ? (st.route.length ? 'sel' : 'good') : 'idle'));
      return { cells, edges };
    },
    note: () => st.route.length ? `当前路线：${st.route.map(name).join(' → ')}` : `从「${name(L.start)}」开始点。`,
    onCell(id) {
      st.flash = null;
      if (!st.route.length) {
        if (id !== L.start) { toast(`路线要从「${name(L.start)}」出发`); buzz(20); return; }
        st.route = [id];
      } else {
        const last = st.route[st.route.length - 1];
        if (id === last) { st.route.pop(); refresh(); return; }
        if (!has(last, id)) { toast(`没有从「${name(last)}」通往「${name(id)}」的单行道`); buzz(20); return; }
        st.route.push(id);
        if (id === L.end) {
          const key = st.route.join('>');
          if (st.found.some(r => r.join('>') === key)) toast('这条路线已经找过了');
          else { st.found = [...st.found, st.route]; toast(`找到第 ${st.found.length} 条路线`); buzz(15); }
          st.flash = st.route;
          st.route = [];
          persist();
          refresh();
          if (st.found.length === total) setTimeout(pass, reduced() ? 0 : 500);
          return;
        }
      }
      buzz(6);
      refresh();
    },
    panel() {
      return `<div class="pcard"><h3>已找到的路线<small>${st.found.length} / ${total}</small></h3>
        <div class="routes">${st.found.length ? st.found.map((r, k) => `<div class="route">${k + 1}. ${r.map(name).join(' → ')}</div>`).join('') : '<div class="route empty">还没有</div>'}
        ${st.route.length ? `<div class="route now">正在走：${st.route.map(name).join(' → ')}</div>` : ''}</div></div>
        <div class="pcard"><h3>规则</h3><p>只能顺着箭头走。点到「${name(L.end)}」就记下一条路线；同一条路线只算一次。</p></div>`;
    },
    dock: () => ({ meta: `已找到 <b>${st.found.length}</b> / ${total} 条`, sec: st.route.length ? '撤销一步' : '', secAct: 'undo' }),
    act(name2) { if (name2 === 'undo') { st.route.pop(); refresh(); } },
  };
}

/* ================= mode: fill ================= */

function fillMode(L, saved) {
  const st = { vals: saved && saved.vals ? saved.vals : {}, sel: null, input: '', marks: {} };
  const by = Object.fromEntries(L.cells.map(c => [c.id, c]));
  const truth = evalGraph(L.cells.map(c => (c.id === L.start ? { ...c, fixed: 1 } : c)), L.edges);
  const order = truth.order, preds = id => L.edges.filter(e => e[1] === id).map(e => e[0]);
  const name = id => (by[id].grid ? `第 ${+id.split(',')[0] + 1} 行第 ${+id.split(',')[1] + 1} 列的路口` : `「${by[id].label}」`);
  const valOf = id => (id === L.start ? 1 : st.vals[id] ?? null);
  const empties = () => L.cells.filter(c => c.id !== L.start && valOf(c.id) === null).length;
  return {
    st,
    save: () => ({ vals: st.vals }),
    scene() {
      const pr = st.sel ? preds(st.sel) : [];
      const cells = L.cells.map(c => {
        const v = valOf(c.id);
        const cls = [c.id === L.start ? 'src' : '', st.sel === c.id ? 'sel' : '', pr.includes(c.id) ? 'pred' : '', st.marks[c.id] || ''];
        const base = by[c.id].grid
          ? { w: 58, h: 58, corner: c.id === L.start ? '起' : c.id === L.end ? '终' : '' }
          : { w: 84, h: 64, label: c.label };
        return { id: c.id, x: c.x, y: c.y, ...base, value: st.sel === c.id ? (st.input || '_') : v === null ? '' : v, cls: cls.filter(Boolean).join(' '), tap: true, aria: name(c.id) };
      });
      const edges = L.edges.map(([a, b]) => E(a, b, b === st.sel ? 'hot' : by[a].grid ? 'dim' : 'idle'));
      return { cells, edges };
    },
    note: () => st.sel ? `指向${name(st.sel)}的箭头来自：${preds(st.sel).map(id => (by[id].grid ? name(id) : `「${by[id].label}」`)).join('、')}` : `已填 ${L.cells.length - 1 - empties()} / ${L.cells.length - 1}`,
    onCell(id) {
      if (cur.running) return;
      if (id === L.start) { toast(`起点已经填好了：到这里的路线算 1 条`); return; }
      st.sel = st.sel === id ? null : id;
      st.input = st.sel && st.vals[id] != null ? String(st.vals[id]) : '';
      refresh();
    },
    panel() {
      return `<div class="pcard"><h3>规则</h3><div class="rule">到一个地点的路线数<br>= 所有指向它的地点的路线数之和</div><p>起点算 <b>1</b>。选中一个${L.grid ? '路口' : '地点'}后，它的「上一站」会亮起黄色虚框，指向它的箭头会变成黄色。</p></div>`;
    },
    dock() {
      if (st.sel) return { pad: true };
      return { meta: `已填 <b>${L.cells.length - 1 - empties()}</b> / ${L.cells.length - 1}`, go: '检查', act: 'check', goIcon: ICON.check };
    },
    padTitle: () => `到${name(st.sel)}的路线数`,
    key(k) {
      if (!st.sel) return;
      if (k === 'del') st.input = st.input.slice(0, -1);
      else if (k === 'ok') {
        st.vals[st.sel] = st.input === '' ? null : Number(st.input);
        delete st.marks[st.sel];
        persist();
        const next = order.find(id => id !== L.start && valOf(id) === null);
        st.sel = next || null;
        st.input = '';
      } else if (st.input.length < 4) st.input = (st.input === '0' ? '' : st.input) + k;
      buzz(5);
      refresh();
    },
    act(name2) { if (name2 === 'check') this.check(); },
    check() {
      const left = empties();
      if (left) { toast(`还有 ${left} 个${L.grid ? '路口' : '地点'}没填`); buzz(20); return; }
      st.marks = {};
      const wrong = order.filter(id => valOf(id) !== truth.val[id]);
      order.forEach(id => { if (id !== L.start) st.marks[id] = wrong.includes(id) ? 'bad' : 'ok'; });
      refresh();
      if (!wrong.length) { pass(); return; }
      const w = wrong[0], ps = preds(w), pv = ps.map(valOf), right = truth.val[w];
      const from = ps.map(id => (by[id].grid ? name(id) : `「${by[id].label}」`)).join('和');
      const body = ps.length === 1
        ? `指向${name(w)}的箭头只来自${from}，所以它和${from}一样，是 <b>${pv[0]}</b>。你填的是 <b>${valOf(w)}</b>。`
        : `指向${name(w)}的箭头来自${from}，它们的数是 ${pv.join(' 和 ')}，所以应该是 <b>${pv.join(' + ')} = ${right}</b>。你填的是 <b>${valOf(w)}</b>。`;
      fail({ head: `${wrong.length} 处填得不对`, body: `红框是填错的格子。先看第一个：${body}` });
    },
  };
}

/* ================= mode: machine ================= */

const OPTS = {
  start: { label: '起点格的数', hint: '站在起点时，算几种方式？', options: [{ v: 0, l: '0' }, { v: 1, l: '1' }] },
  rock: { label: '石头格', hint: '被落石堵住的格子里放什么？', options: [{ v: 'normal', l: '照常盖章' }, { v: 'zero', l: '记为 0' }] },
  order: { label: '盖章顺序', hint: '机器按什么顺序一格格计算？', two: true, options: Object.keys(ORDERS).map(v => ({ v, l: ORDERS[v].l })) },
  op: { label: '合并方式', hint: '几根箭头送来的数，怎么合成一个？', options: [{ v: 'sum', l: '加起来' }, { v: 'min', l: '取较小' }, { v: 'max', l: '取较大' }] },
  addCost: { label: '本格体力', hint: '合并之后，要不要再加上这一格自己的体力？', options: [{ v: false, l: '不加' }, { v: true, l: '加上' }] },
};
const opLabel = { sum: '加起来', min: '取较小', max: '取较大' };

function machineMode(L, saved) {
  const st = { cfg: { ...L.defaults, ...(saved && saved.cfg ? saved.cfg : {}) }, ti: 0, status: L.tests.map(() => null), view: null };
  const rule = () => ({ ...L.fixedRule, ...st.cfg });
  const strip = L.kind === 'strip';
  const testLabel = t => (strip ? `第 ${t.n} 级` : `${t.R}×${t.C}${t.rocks ? ` · ${t.rocks.length} 块石头` : ''}`);
  const cellName = (t, id) => (strip ? `第 ${id} 级` : `第 ${+id.split(',')[0] + 1} 行第 ${+id.split(',')[1] + 1} 列`);
  const ruleText = () => {
    const r = rule(), names = r.stencil.map(k => (strip ? `第 ${STENCIL_STRIP[k].l} 级` : STENCIL_GRID[k].l));
    const core = names.length ? `${names.join('、')}的数${names.length > 1 ? `，${opLabel[r.op]}` : ''}` : '0（没有点亮邻居）';
    return `每格 = ${core}${r.addCost ? ' + 本格体力' : ''}<br>${strip ? '地面' : '起点'} = ${r.start}${r.addCost ? ' + 本格体力' : ''}${r.rock === 'zero' ? '<br>石头格 = 0' : ''}`;
  };
  return {
    st,
    save: () => ({ cfg: st.cfg }),
    tests: () => L.tests.map((t, k) => ({ label: `测试 ${k + 1} · ${testLabel(t)}`, status: st.status[k] })),
    selectTest(k) { st.ti = k; st.view = null; refresh(); },
    scene() {
      const t = L.tests[st.ti], cells = worldCells(t), r = rule(), v = st.view;
      const step = v && v.k > 0 ? v.res.steps[v.k - 1] : null, done = v && v.k >= v.res.steps.length;
      const shown = new Map();
      if (v) v.res.steps.slice(0, v.k).forEach(s => { if (!s.err) shown.set(s.id, s.v); });
      const sc = strip ? 58 : 64, sz = strip ? 50 : 56;
      const sceneCells = cells.map(c => {
        const cls = [c.rock ? 'rock' : '', step && step.id === c.id && !done ? 'hot' : '', step && step.err && step.id === c.id ? 'bad' : '', step && step.missing && step.missing.includes(c.id) ? 'bad' : '', shown.has(c.id) && !(step && step.id === c.id && !done) ? 'lit' : '', done && c.end ? (v.pass ? 'ok' : 'bad') : ''];
        return { id: c.id, x: strip ? c.i * sc : c.c * sc, y: strip ? 0 : c.r * sc, w: sz, h: sz, value: shown.has(c.id) ? shown.get(c.id) : '', corner: strip ? c.i : c.cost !== null ? c.cost : c.start ? '起' : c.end ? '终' : '', cls: cls.filter(Boolean).join(' ') };
      });
      const edges = [];
      for (const c of cells) {
        if (c.start || (c.rock && r.rock === 'zero')) continue;
        for (const k of r.stencil) {
          const nb = neighborId(t, c, k);
          if (!nb) continue;
          const active = step && step.id === c.id && !done;
          const missing = active && step.missing && step.missing.includes(nb);
          const bend = strip && STENCIL_STRIP[k].d < -1 ? -(16 + 16 * -STENCIL_STRIP[k].d) : 0;
          edges.push(E(nb, c.id, missing ? 'bad' : active ? 'hot' : 'dim', bend));
        }
      }
      return { cells: sceneCells, edges };
    },
    boardOpt: () => ({ minScale: strip ? 0.62 : 0.72, maxScale: 1.3 }),
    note() {
      const v = st.view;
      if (!v) return `印章会盖在每一个格子上。${strip ? '机器从第 0 级往上算。' : `机器按「${ORDERS[rule().order].l}」的顺序算。`}`;
      const step = v.res.steps[Math.max(0, v.k - 1)];
      if (v.k < v.res.steps.length && step) {
        const r = rule(), vals = step.ins.map(id => shownVal(v, id));
        const expr = !vals.length ? '' : vals.length === 1 ? vals[0] : r.op === 'sum' ? vals.join(' + ') : `${opLabel[r.op]}(${vals.join(', ')})`;
        return `正在算${cellName(L.tests[st.ti], step.id)}${expr ? `：${expr}${r.addCost ? ' + 本格体力' : ''}` : ''}`;
      }
      if (v.res.error) return `卡住了：${cellName(L.tests[st.ti], v.res.error.cell.id)}要用的格子还没算出来。`;
      return v.pass ? `终点算出 ${fmt(v.res.value)}，正确。` : `终点算出 ${fmt(v.res.value)}，应该是 ${fmt(L.expected[st.ti])}。`;
    },
    panel() {
      const r = rule(), editS = L.edit.includes('stencil');
      let stencil;
      if (strip) {
        const cellsH = ['m3', 'm2', 'm1'].map(k => stencilBtn(k, STENCIL_STRIP[k].l, '→', r.stencil.includes(k), editS)).join('') + '<div class="sb-mid">第 i 级</div>' + stencilBtn('p1', STENCIL_STRIP.p1.l, '←', r.stencil.includes('p1'), editS);
        stencil = `<div class="stencil strip">${cellsH}</div>`;
      } else {
        const order = ['ul', 'u', 'ur', 'l', 'mid', 'r', 'dl', 'd', 'dr'];
        stencil = `<div class="stencil">${order.map(k => (k === 'mid' ? '<div class="sb-mid">本格</div>' : stencilBtn(k, STENCIL_GRID[k].l, STENCIL_GRID[k].ar, r.stencil.includes(k), editS))).join('')}</div>`;
      }
      const usesTag = L.uses ? L.uses.map(k => `<span class="tag">${ICON.part}零件 · ${PARTS[k].name}</span>`).join('') : '';
      const opts = L.edit.filter(k => k !== 'stencil').map(k => {
        const o = OPTS[k];
        return `<div class="pcard"><div><div class="optlabel">${o.label}</div><div class="opthint">${o.hint}</div></div>
          <div class="chips${o.two ? ' two' : ''}" role="radiogroup" aria-label="${o.label}">${o.options.map((x, j) => `<button class="chip" type="button" role="radio" aria-checked="${st.cfg[k] === x.v}" data-act="opt" data-k="${k}" data-j="${j}">${x.l}</button>`).join('')}</div></div>`;
      }).join('');
      return `<div class="pcard"><h3>印章<small>${editS ? '点亮的邻居会连箭头到中间' : '已锁定'}</small></h3>${usesTag}${stencil}</div>
        ${opts}
        <div class="pcard"><h3>你的机器</h3><div class="rule">${ruleText()}</div></div>`;
    },
    dock: () => ({ meta: `${L.tests.length} 个测试`, go: cur.running ? '跳过动画' : '运行测试', act: 'run', busy: cur.running }),
    act(name, el) {
      if (name === 'stencil') {
        if (cur.running) return;
        const k = el.dataset.k, s = new Set(st.cfg.stencil);
        if (s.has(k)) s.delete(k); else s.add(k);
        st.cfg.stencil = [...s];
        clearRuns();
      }
      if (name === 'opt') {
        if (cur.running) return;
        const k = el.dataset.k;
        st.cfg[k] = OPTS[k].options[+el.dataset.j].v;
        clearRuns();
      }
      if (name === 'run') { if (cur.running) Anim.skip(); else this.run(); }
      function clearRuns() { st.status = L.tests.map(() => null); st.view = null; persist(); buzz(6); refresh(); }
    },
    async run() {
      const r = rule();
      if (!r.stencil.length) { toast('印章至少要点亮一个邻居'); buzz(20); return; }
      startRun();
      st.status = L.tests.map(() => null);
      for (let k = 0; k < L.tests.length; k++) {
        st.ti = k;
        st.status[k] = 'run';
        const res = runMachine(L.tests[k], r), ok = !res.error && res.value === L.expected[k];
        st.view = { res, k: 0, pass: ok };
        refresh();
        const per = Math.max(35, Math.min(240, 1600 / res.steps.length));
        for (let j = 1; j <= res.steps.length; j++) {
          st.view.k = j;
          renderBoard();
          await Anim.wait(per);
        }
        st.status[k] = ok ? 'pass' : 'fail';
        refresh();
        if (!ok) {
          endRun();
          refresh();
          const t = L.tests[k], hint = L.hint(r);
          if (res.error) {
            const miss = res.error.missing.map(id => cellName(t, id)).join('和');
            fail({ head: '读到了空格子', body: `测试 ${k + 1} 中，机器算到<b>${cellName(t, res.error.cell.id)}</b>时，印章要读${miss}，可那里还空着。${strip ? '机器是从第 0 级往上算的。' : `机器是按「${ORDERS[r.order].l}」的顺序算的。`}`, hint });
          } else fail({ head: `测试 ${k + 1} 没通过`, body: `${testLabel(t)}：终点应该是 <b>${fmt(L.expected[k])}</b>，机器算出了 <b>${fmt(res.value)}</b>。`, hint });
          return;
        }
        await Anim.wait(380);
      }
      endRun();
      refresh();
      pass();
    },
  };
}
function shownVal(v, id) { const s = v.res.steps.find(x => x.id === id); return s ? fmt(s.v) : '空'; }
function stencilBtn(k, label, ar, on, editable) {
  return `<button class="sb-btn" type="button" aria-pressed="${on}" ${editable ? `data-act="stencil" data-k="${k}"` : 'disabled'} aria-label="${label}"><span class="ar">${on ? ar : '·'}</span><span>${label}</span></button>`;
}

/* ================= mode: backtrack ================= */

function backMode(L) {
  const w = { kind: 'grid', R: L.costs.length, C: L.costs[0].length, costs: L.costs };
  const res = runMachine(w, { stencil: ['u', 'l'], op: 'min', addCost: true, start: 0, order: 'rowTL' });
  const endId = `${w.R - 1},${w.C - 1}`;
  const st = { path: [endId], msg: { cls: '', html: `终点的数是 <b>${res.val.get(endId)}</b>，体力是 <b>${L.costs[w.R - 1][w.C - 1]}</b>。它是从上面来的，还是从左边来的？` } };
  const rc = id => id.split(',').map(Number);
  const cost = id => { const [r, c] = rc(id); return L.costs[r][c]; };
  const nm = id => { const [r, c] = rc(id); return `第 ${r + 1} 行第 ${c + 1} 列`; };
  return {
    st,
    save: () => ({}),
    scene() {
      const now = st.path[st.path.length - 1], [r0, c0] = rc(now);
      const options = [[r0 - 1, c0], [r0, c0 - 1]].filter(([r, c]) => r >= 0 && c >= 0).map(p => p.join(','));
      const done = now === '0,0';
      const cells = worldCells(w).map(c => ({ id: c.id, x: c.c * 66, y: c.r * 66, w: 58, h: 58, value: res.val.get(c.id), corner: c.cost, cls: [st.path.includes(c.id) ? 'path' : '', c.id === now && !done ? 'sel' : '', !done && options.includes(c.id) ? 'pred' : ''].filter(Boolean).join(' '), tap: true, aria: nm(c.id) }));
      const edges = [];
      for (let k = st.path.length - 1; k > 0; k--) edges.push(E(st.path[k], st.path[k - 1], 'good'));
      return { cells, edges };
    },
    note: () => '格子中间是机器算出的最少体力，左上角小字是这一格自己的体力。',
    onCell(id) {
      const now = st.path[st.path.length - 1];
      if (now === '0,0') return;
      const [r0, c0] = rc(now), [r, c] = rc(id);
      const ok = (r === r0 - 1 && c === c0) || (r === r0 && c === c0 - 1);
      if (!ok) { st.msg = { cls: 'bad', html: `只能退到当前格子的<b>上面</b>或<b>左边</b>，也就是黄色虚框的格子。` }; buzz(20); refresh(); return; }
      const need = res.val.get(now), got = res.val.get(id) + cost(now);
      if (got !== need) {
        st.msg = { cls: 'bad', html: `从${nm(id)}过来的话：${res.val.get(id)} + ${cost(now)} = <b>${got}</b>，不等于当前格子的 <b>${need}</b>。所以最省力的路线不是从这里来的。` };
        buzz(20);
        refresh();
        return;
      }
      st.path.push(id);
      buzz(10);
      if (id === '0,0') {
        st.msg = { cls: 'good', html: `回到起点了。正着读这条路线：${[...st.path].reverse().map(nm).join(' → ')}。` };
        refresh();
        setTimeout(pass, reduced() ? 0 : 600);
        return;
      }
      st.msg = { cls: 'good', html: `${res.val.get(id)} + ${cost(now)} = ${need}，对。现在站在${nm(id)}：数是 <b>${res.val.get(id)}</b>，体力是 <b>${cost(id)}</b>。再往回退一步。` };
      refresh();
    },
    panel: () => `<div class="pcard"><h3>倒推</h3><div class="msg ${st.msg.cls}">${st.msg.html}</div></div>
      <div class="pcard"><h3>规则</h3><p>如果从某个邻居过来，那么<b>邻居的数 + 本格体力 = 本格的数</b>。找到满足这个等式的邻居，就知道路线是从哪来的。</p></div>`,
    dock: () => ({ meta: `已退回 <b>${st.path.length - 1}</b> 步`, sec: st.path.length > 1 ? '重来' : '', secAct: 'restart' }),
    act(name) { if (name === 'restart') { st.path = [endId]; st.msg = { cls: '', html: '从终点重新开始。' }; refresh(); } },
  };
}

/* ================= mode: explode ================= */

function explodeMode(L, saved) {
  const st = { n: saved && saved.n ? saved.n : 4, max: saved && saved.max ? saved.max : 4, answered: false };
  return {
    st,
    save: () => ({ n: st.n, max: st.max }),
    custom() {
      const ask = askCalls(st.n), table = st.n + 1;
      const tree = st.n <= 7 ? `<div class="board">${sceneSVG(treeScene(st.n), { pad: 10, label: '问路法的提问树', maxScale: 1.2 })}</div>` : `<div class="toolarge">提问树有 ${fmt(ask)} 个节点，已经画不下了</div>`;
      const strip = Array.from({ length: Math.min(st.n, 9) + 1 }, (_, i) => ({ id: `s${i}`, x: i * 54, y: 0, w: 46, h: 46, value: '', corner: i, cls: 'lit' }));
      return `<div class="duo">
        <section class="slow"><h4>问路法</h4><span class="k">提问次数</span><span class="bignum">${fmt(ask)}</span>${tree}</section>
        <section class="fast"><h4>填表法</h4><span class="k">计算次数</span><span class="bignum">${fmt(table)}</span><div class="board">${sceneSVG({ cells: strip, edges: [] }, { pad: 6, maxScale: 1 })}</div>${st.n > 9 ? `<span class="k">……一直到第 ${st.n} 级，每级一次</span>` : ''}</section>
      </div>`;
    },
    note: () => (st.n <= 7 ? '同一种颜色、同一个数字，代表同一级台阶被问了好几遍。' : `台阶数 ${st.n}：问路法要问 ${fmt(askCalls(st.n))} 次。`),
    panel() {
      const q = L.question;
      return `<div class="pcard"><h3>台阶数<small>n = ${st.n}</small></h3>
        <input class="range" id="nRange" type="range" min="1" max="40" step="1" value="${st.n}" aria-label="台阶数">
        <p>拖到 30 以上，问路法要问几百万次，填表法只要 30 多次。</p></div>
        <div class="pcard" id="whyQ" ${st.max >= 30 ? '' : 'hidden'}><h3>想一想</h3><p><b>${q.q}</b></p>${q.opts.map((o, k) => `<button class="qopt" type="button" data-act="answer" data-k="${k}">${o}</button>`).join('')}</div>`;
    },
    dock: () => ({ meta: st.max >= 30 ? '回答规则面板里的问题' : `先把台阶数拖到 <b>30</b> 以上（现在 ${st.n}）` }),
    input(v) { st.n = v; st.max = Math.max(st.max, v); persist(); refreshKeepRange(); },
    act(name, el) {
      if (name !== 'answer' || st.answered) return;
      if (+el.dataset.k === L.question.a) { st.answered = true; el.classList.add('right'); buzz(15); setTimeout(pass, reduced() ? 0 : 500); }
      else { el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); buzz(20); }
    },
  };
}

/* ================= mode: lab (configurable rule machine) ================= */

function labCtl(c, st) {
  const v = st.cfg[c.id], head = `<div><div class="optlabel">${c.label}</div>${c.hint ? `<div class="opthint">${c.hint}</div>` : ''}</div>`;
  if (c.type === 'stencil') {
    const cellsH = ['ul', 'u', 'ur', 'l', 'mid', 'r', 'dl', 'd', 'dr'].map(k => {
      if (k === 'mid') return '<div class="sb-mid">本格</div>';
      if (!c.keys.includes(k)) return '<div class="sb-off" aria-hidden="true"></div>';
      const on = v.includes(k);
      return `<button class="sb-btn" type="button" aria-pressed="${on}" data-act="lsten" data-c="${c.id}" data-k="${k}" aria-label="${STENCIL_GRID[k].l}"><span class="ar">${on ? STENCIL_GRID[k].ar : '·'}</span><span>${STENCIL_GRID[k].l}</span></button>`;
    }).join('');
    return `<div class="pcard">${head}<div class="stencil">${cellsH}</div></div>`;
  }
  const multi = c.type === 'multi';
  const opts = c.options.map((o, j) => {
    const on = multi ? v.includes(o.v) : v === o.v, locked = o.lock && !st.flags[o.lock];
    const state = multi ? `aria-pressed="${on}"` : `role="radio" aria-checked="${on}"`;
    return `<button class="chip${multi ? ' multi' : ''}" type="button" ${state} data-act="lopt" data-c="${c.id}" data-j="${j}"${locked ? ' disabled' : ''}>${multi ? '<span class="box" aria-hidden="true"></span>' : ''}<span>${o.l}</span>${locked ? `<span class="lk">${ICON.lock}${o.lockText}</span>` : ''}</button>`;
  }).join('');
  return `<div class="pcard">${head}<div class="chips${c.layout ? ` ${c.layout}` : ''}"${multi ? ` role="group" aria-label="${c.label}"` : ` role="radiogroup" aria-label="${c.label}"`}>${opts}</div></div>`;
}

function labMode(L, saved) {
  const st = { cfg: { ...L.defaults, ...((saved && saved.cfg) || {}) }, flags: { ...((saved && saved.flags) || {}) }, ti: 0, status: L.tests.map(() => null), view: null };
  const changed = () => { st.status = L.tests.map(() => null); st.view = null; persist(); buzz(6); refresh(); };
  return {
    st,
    save: () => ({ cfg: st.cfg, flags: st.flags }),
    tests: () => L.tests.map((t, k) => ({ label: `测试 ${k + 1} · ${L.testLabel(t)}`, status: st.status[k] })),
    selectTest(k) { st.ti = k; st.view = null; refresh(); },
    scene: () => L.scene(L.tests[st.ti], st.cfg, st.view),
    boardOpt: () => L.boardOpt || { minScale: 0.7, maxScale: 1.25 },
    note: () => L.note(L.tests[st.ti], st.cfg, st.view, L.expected[st.ti]),
    after: () => (L.after ? L.after(L.tests[st.ti], st.cfg, st.view) : ''),
    panel() {
      const uses = L.uses ? `<div class="pcard"><div class="chips">${L.uses.map(k => `<span class="tag">${ICON.part}零件 · ${PARTS[k].name}</span>`).join('')}</div></div>` : '';
      return `${uses}${L.controls.filter(c => !c.when || c.when(st.cfg)).map(c => labCtl(c, st)).join('')}<div class="pcard"><h3>你的机器</h3><div class="rule">${L.ruleText(st.cfg)}</div></div>`;
    },
    dock: () => ({ meta: `${L.tests.length} 个测试`, go: cur.running ? '跳过动画' : '运行测试', act: 'run', busy: cur.running }),
    act(name, el) {
      if (name === 'run') { if (cur.running) Anim.skip(); else this.run(); return; }
      if (cur.running) return;
      const c = L.controls.find(x => x.id === el.dataset.c);
      if (!c) return;
      if (name === 'lopt') {
        const o = c.options[+el.dataset.j];
        if (c.type === 'multi') {
          const s = new Set(st.cfg[c.id]);
          if (s.has(o.v)) s.delete(o.v); else s.add(o.v);
          st.cfg[c.id] = c.options.map(x => x.v).filter(x => s.has(x));
        } else st.cfg[c.id] = o.v;
        changed();
      }
      if (name === 'lsten') {
        const s = new Set(st.cfg[c.id]), k = el.dataset.k;
        if (s.has(k)) s.delete(k); else s.add(k);
        st.cfg[c.id] = c.keys.filter(x => s.has(x));
        changed();
      }
    },
    async run() {
      const err = L.validate && L.validate(st.cfg);
      if (err) { toast(err); buzz(20); return; }
      startRun();
      st.status = L.tests.map(() => null);
      for (let k = 0; k < L.tests.length; k++) {
        const t = L.tests[k], res = L.run(t, st.cfg), ok = !res.error && res.value === L.expected[k];
        st.ti = k;
        st.status[k] = 'run';
        st.view = { res, k: 0, pass: ok };
        refresh();
        const per = Math.max(22, Math.min(220, 1700 / res.steps.length));
        for (let j = 1; j <= res.steps.length; j++) {
          st.view.k = j;
          renderBoard();
          await Anim.wait(per);
        }
        st.status[k] = ok ? 'pass' : 'fail';
        if (!ok) {
          endRun();
          refresh();
          const x = L.explain(t, st.cfg, res, L.expected[k], k, st, L);
          if (x.hint === undefined) x.hint = L.hint ? L.hint(st.cfg) : null;
          fail(x);
          return;
        }
        refresh();
        await Anim.wait(420);
      }
      endRun();
      refresh();
      pass();
    },
  };
}

/* ================= mode: breach (find a counterexample) ================= */

function breachMode(L) {
  const w = L.world, kid = w.key.join(','), doors = new Set(w.doors.map(d => d.join(',')));
  const st = { A: [], B: [], active: 'A', msg: null, tries: 0 };
  const rc = id => id.split(',').map(Number), gotKey = route => route.includes(kid);
  const info = r => (st[r].length ? `${st[r].length - 1} 步 · 停在${rcName(st[r].at(-1))} · ${gotKey(st[r]) ? '拿了钥匙' : '没拿钥匙'}` : '还没开始');
  return {
    st,
    save: () => ({}),
    scene() {
      const sp = 66, sz = 58, cells = [], edges = [], end = `${w.R - 1},${w.C - 1}`, tail = st[st.active].at(-1);
      for (let r = 0; r < w.R; r++) for (let c = 0; c < w.C; c++) {
        const id = `${r},${c}`, a = st.A.includes(id), b = st.B.includes(id);
        const cls = [id === kid ? 'key' : '', doors.has(id) ? 'door' : '', a && b ? 'rab' : a ? 'ra' : b ? 'rb' : '', id === tail ? 'sel' : ''];
        cells.push({ id, x: c * sp, y: r * sp, w: sz, h: sz, value: a && b ? 'A B' : a ? 'A' : b ? 'B' : '', label: id === kid ? '钥匙' : doors.has(id) ? '门' : '', corner: id === '0,0' ? '起' : id === end ? '终' : '', cls: cls.filter(Boolean).join(' '), tap: true, aria: rcName(id) });
        if (c + 1 < w.C) edges.push(E(id, `${r},${c + 1}`, 'dim'));
        if (r + 1 < w.R) edges.push(E(id, `${r + 1},${c}`, 'dim'));
      }
      st.A.slice(1).forEach((id, q) => edges.push(E(st.A[q], id, 'ra', 0, -4)));
      st.B.slice(1).forEach((id, q) => edges.push(E(st.B[q], id, 'rb', 0, 4)));
      return { cells, edges };
    },
    boardOpt: () => ({ maxScale: 1.2 }),
    note: () => `正在画路线 ${st.active}。点路线的最后一格可以撤销一步。`,
    onCell(id) {
      const route = st[st.active];
      st.msg = null;
      if (!route.length) {
        if (id !== '0,0') { toast('路线要从左上角的起点出发'); buzz(20); return; }
        route.push(id);
      } else {
        const last = route.at(-1);
        if (id === last) { route.pop(); refresh(); return; }
        const [r0, c0] = rc(last), [r, c] = rc(id);
        if (!((r === r0 && c === c0 + 1) || (r === r0 + 1 && c === c0))) { toast('只能从路线的最后一格，往右或往下走一格'); buzz(20); return; }
        if (doors.has(id) && !gotKey(route)) { toast('没有钥匙，过不了这扇门'); buzz([20, 40, 20]); return; }
        route.push(id);
      }
      buzz(6);
      refresh();
    },
    panel() {
      return `<div class="pcard"><h3>两条路线</h3>
        <div class="chips two" role="radiogroup" aria-label="正在画的路线">${['A', 'B'].map(r => `<button class="chip route-${r}" type="button" role="radio" aria-checked="${st.active === r}" data-act="route" data-r="${r}">路线 ${r}</button>`).join('')}</div>
        <div class="routes"><div class="route ra-line">A：${info('A')}</div><div class="route rb-line">B：${info('B')}</div></div>
        <button class="sec-btn" type="button" data-act="clear"${st[st.active].length ? '' : ' disabled'}>清空路线 ${st.active}</button></div>
        ${st.msg ? `<div class="pcard"><h3>检验结果</h3><div class="msg ${st.msg.cls}">${st.msg.html}</div></div>` : ''}
        <div class="pcard"><h3>合格的反例</h3><p>1. 两条路线停在<b>同一格</b>：在计数器眼里，它们是同一个状态。<br>2. 一条<b>拿了钥匙</b>，一条<b>没拿</b>。<br>3. 从这一格往右或往下一步，<b>就是门</b>：它们的未来不同。</p></div>`;
    },
    dock: () => ({ meta: `正在画 <b>路线 ${st.active}</b>`, sec: st[st.active].length ? '撤销一步' : '', secAct: 'undo', go: '检验', act: 'check', goIcon: ICON.check }),
    act(name, el) {
      if (name === 'route') st.active = el.dataset.r;
      if (name === 'undo') { st[st.active].pop(); st.msg = null; }
      if (name === 'clear') { st[st.active] = []; st.msg = null; }
      if (name === 'check') { this.check(); return; }
      refresh();
    },
    check() {
      const A = st.A, B = st.B, bad = html => { st.tries++; st.msg = { cls: 'bad', html: `${html}${st.tries >= 2 ? `<br><br><b>提示</b>：${L.hintText}` : ''}` }; buzz([20, 40, 20]); refresh(); };
      if (!A.length || !B.length) { bad('先画好两条路线。在规则面板里切换 A 和 B。'); return; }
      const ea = A.at(-1), eb = B.at(-1);
      if (ea !== eb) { bad(`两条路线停在不同的格子：A 在${rcName(ea)}，B 在${rcName(eb)}。计数器当然分得清不同的格子，让它们停在同一格。`); return; }
      if (gotKey(A) === gotKey(B)) { bad(`两条路线${gotKey(A) ? '都拿了' : '都没拿'}钥匙。它们不光状态相同，未来也一样，这不算破绽。让一条拿钥匙，另一条不拿。`); return; }
      const [r, c] = rc(ea), next = [`${r},${c + 1}`, `${r + 1},${c}`].filter(id => doors.has(id));
      if (!next.length) { bad(`它们在${rcName(ea)}汇合，一条有钥匙，一条没有。可从这里往右或往下一步都碰不到门，暂时还看不出区别。让它们在门的左边或上面汇合。`); return; }
      const keyed = gotKey(A) ? 'A' : 'B', other = keyed === 'A' ? 'B' : 'A';
      st.msg = { cls: 'good', html: `找到了！两条路线都停在${rcName(ea)}。路线 ${keyed} 带着钥匙，下一步能穿过${rcName(next[0])}的门；路线 ${other} 空着手，过不去。可在只记位置的计数器眼里，它们是同一个状态。` };
      buzz(15);
      refresh();
      setTimeout(pass, reduced() ? 0 : 900);
    },
  };
}

/* ================= mode: link (non-crossing matching) ================= */

function linkMode(L, saved) {
  const st = { ti: 0, links: L.tests.map((_, k) => (saved && saved.links && saved.links[k]) || []), sel: null, flash: null, hint: false };
  const target = k => lcsLen(L.tests[k].a, L.tests[k].b), solved = k => st.links[k].length >= target(k);
  return {
    st,
    save: () => ({ links: st.links }),
    tests: () => L.tests.map((t, k) => ({ label: `第 ${k + 1} 题 · ${t.a} / ${t.b}`, status: solved(k) ? 'pass' : null })),
    selectTest(k) { st.ti = k; st.sel = null; st.flash = null; st.hint = false; refresh(); },
    scene() {
      const { a, b } = L.tests[st.ti], links = st.links[st.ti], sp = 50, sz = 44, n = Math.max(a.length, b.length);
      const oa = (n - a.length) * sp / 2, ob = (n - b.length) * sp / 2, fl = st.flash ? st.flash.links : [];
      const la = new Set(links.map(l => l[0])), lb = new Set(links.map(l => l[1]));
      const isFl = (i, j) => fl.some(l => l[0] === i && l[1] === j);
      const cls = (side, idx) => {
        const linked = side === 'a' ? la.has(idx) : lb.has(idx), selected = st.sel && st.sel.side === side && st.sel.idx === idx;
        const flashed = st.flash && (side === 'a' ? st.flash.try[0] === idx || fl.some(l => l[0] === idx) : st.flash.try[1] === idx || fl.some(l => l[1] === idx));
        return ['tile', selected ? 'sel' : '', flashed ? 'bad' : linked ? 'ok' : ''].filter(Boolean).join(' ');
      };
      const cells = [
        ...[...a].map((ch, i) => ({ id: `a${i}`, x: oa + i * sp, y: 0, w: sz, h: sz, value: ch, cls: cls('a', i), tap: true, aria: `上面第 ${i + 1} 个字 ${ch}` })),
        ...[...b].map((ch, j) => ({ id: `b${j}`, x: ob + j * sp, y: 150, w: sz, h: sz, value: ch, cls: cls('b', j), tap: true, aria: `下面第 ${j + 1} 个字 ${ch}` })),
      ];
      const edges = links.map(([i, j]) => E(`a${i}`, `b${j}`, isFl(i, j) ? 'linkbad' : 'link'));
      if (st.flash) edges.push(E(`a${st.flash.try[0]}`, `b${st.flash.try[1]}`, 'linkbad'));
      return { cells, edges };
    },
    boardOpt: () => ({ maxScale: 1.3 }),
    note: () => (st.sel ? `已选中${st.sel.side === 'a' ? '上面' : '下面'}的「${L.tests[st.ti][st.sel.side][st.sel.idx]}」，再点另一行里相同的字。` : '连上的字从左往右读，就是两串字共有的一串。'),
    onCell(id) {
      const side = id[0], idx = +id.slice(1), t = L.tests[st.ti], links = st.links[st.ti];
      st.flash = null;
      const at = links.findIndex(l => (side === 'a' ? l[0] : l[1]) === idx);
      if (!st.sel && at >= 0) { links.splice(at, 1); toast('拆掉了一根线'); persist(); refresh(); return; }
      if (!st.sel || st.sel.side === side) { st.sel = st.sel && st.sel.side === side && st.sel.idx === idx ? null : { side, idx }; buzz(5); refresh(); return; }
      const i = side === 'a' ? idx : st.sel.idx, j = side === 'b' ? idx : st.sel.idx;
      st.sel = null;
      if (t.a[i] !== t.b[j]) { toast(`「${t.a[i]}」和「${t.b[j]}」不一样，不能连`); buzz(20); refresh(); return; }
      if (links.some(l => l[0] === i || l[1] === j)) { toast('每个字最多连一根线。先点它，拆掉原来的线'); buzz(20); refresh(); return; }
      const cross = links.filter(l => (l[0] - i) * (l[1] - j) < 0);
      if (cross.length) {
        st.flash = { links: cross, try: [i, j] };
        toast('线不能交叉');
        buzz([20, 40, 20]);
        refresh();
        setTimeout(() => { if (cur && cur.ctl.st === st && st.flash) { st.flash = null; refresh(); } }, 1200);
        return;
      }
      links.push([i, j]);
      links.sort((p, q) => p[0] - q[0]);
      persist();
      buzz(8);
      refresh();
      if (!solved(st.ti)) return;
      if (L.tests.every((_, k) => solved(k))) { setTimeout(pass, reduced() ? 0 : 500); return; }
      toast(`第 ${st.ti + 1} 题完成`);
      const nx = L.tests.findIndex((_, k) => !solved(k));
      setTimeout(() => { if (cur && cur.ctl.st === st) this.selectTest(nx); }, 900);
    },
    panel() {
      const t = L.tests[st.ti], links = st.links[st.ti];
      return `<div class="pcard"><h3>三条规则</h3><p>1. 只能连<b>相同</b>的字<br>2. 每个字最多连<b>一根</b>线<br>3. 线<b>不能交叉</b></p></div>
        <div class="pcard"><h3>连出的公共子序列<small>${links.length} / ${target(st.ti)} 个字</small></h3>
          <div class="diff">${links.length ? links.map(l => `<span class="dt ins">${t.a[l[0]]}</span>`).join('') : '<span class="opthint">还没有连线</span>'}</div></div>
        <div class="pcard"><h3>卡住了？</h3>${st.hint ? `<p>${L.hints[st.ti]}</p>` : '<button class="sec-btn" type="button" data-act="hint">看提示</button>'}</div>`;
    },
    dock: () => ({ meta: `已连 <b>${st.links[st.ti].length}</b> 根 · 目标 <b>${target(st.ti)}</b> 根`, sec: st.links[st.ti].length ? '清空这题' : '', secAct: 'clear' }),
    act(name) {
      if (name === 'hint') st.hint = true;
      if (name === 'clear') { st.links[st.ti] = []; st.sel = null; persist(); }
      refresh();
    },
  };
}

/* ================= mode: pack (fill the backpack by hand) ================= */

function packMode(L, saved) {
  const st = { ti: 0, bags: L.tests.map((_, k) => (saved && saved.bags && saved.bags[k]) || []), tried: L.tests.map(() => new Set()), msg: null };
  const target = k => knapBest(L.tests[k]);
  const sum = (k, f) => st.bags[k].reduce((s, i) => s + L.tests[k].items[i][f], 0);
  const solved = k => sum(k, 'v') >= target(k);
  st.bags.forEach((b, k) => st.tried[k].add(b.join(',')));
  const settle = () => {
    st.tried[st.ti].add(st.bags[st.ti].join(','));
    persist();
    refresh();
    if (!solved(st.ti)) return;
    if (L.tests.every((_, k) => solved(k))) { setTimeout(pass, reduced() ? 0 : 600); return; }
    toast(`第 ${st.ti + 1} 题完成，达到了目标价值`);
    const nx = L.tests.findIndex((_, k) => !solved(k));
    setTimeout(() => { if (cur && cur.ctl.st === st) { st.ti = nx; st.msg = null; refresh(); } }, 1000);
  };
  return {
    st,
    save: () => ({ bags: st.bags }),
    tests: () => L.tests.map((t, k) => ({ label: `第 ${k + 1} 题 · ${t.W} kg 背包`, status: solved(k) ? 'pass' : null })),
    selectTest(k) { st.ti = k; st.msg = null; refresh(); },
    custom() {
      const t = L.tests[st.ti], bag = st.bags[st.ti], used = sum(st.ti, 'w'), val = sum(st.ti, 'v'), tg = target(st.ti);
      return `<div class="pack">
        <div class="bag">
          <div class="bag-meta"><span>背包 <b>${used}</b> / ${t.W} kg</span><span class="${val >= tg ? 'hit' : ''}">价值 <b>${val}</b> · 目标 ${tg}</span></div>
          <div class="bag-bar" role="img" aria-label="背包装了 ${used} 千克，上限 ${t.W} 千克">${bag.map(k => `<i style="flex:${t.items[k].w};background:var(--t${k % 6})"><span>${t.items[k].n}</span></i>`).join('')}${t.W > used ? `<i class="free" style="flex:${t.W - used}"></i>` : ''}</div>
        </div>
        <div class="items">${t.items.map((it, k) => `<button class="itm" type="button" aria-pressed="${bag.includes(k)}" data-act="item" data-k="${k}" style="--c:var(--t${k % 6})"><span class="itm-top"><b>${it.n}</b><span class="v">价值 ${it.v}</span></span><span class="kg" aria-label="${it.w} 千克">${'<i></i>'.repeat(it.w)}<em>${it.w} kg</em></span></button>`).join('')}</div>
      </div>`;
    },
    note: () => '点物品放进或拿出背包。',
    panel() {
      const n = L.tests[st.ti].items.length;
      return `<div class="pcard"><h3>自动装包</h3><p>两种常见的捷径：按某种顺序挨个看，装得下就装。</p>
          <div class="chips two"><button class="chip" type="button" data-act="greedy" data-g="val">最贵的先放</button><button class="chip" type="button" data-act="greedy" data-g="ratio">最划算的先放</button></div>
          ${st.msg ? `<div class="msg ${st.msg.cls}">${st.msg.html}</div>` : ''}<p class="opthint">「最划算」指每千克的价值最高。</p></div>
        <div class="pcard"><h3>试过的装法<small>${st.tried[st.ti].size} / ${2 ** n} 种</small></h3><p>${n} 件物品，每件都有带和不带两种选择，一共 <b>${2 ** n}</b> 种装法。物品每多一件，装法就翻一倍。</p></div>`;
    },
    dock: () => ({ meta: `价值 <b>${sum(st.ti, 'v')}</b> · 目标 <b>${target(st.ti)}</b>`, sec: st.bags[st.ti].length ? '倒空背包' : '', secAct: 'empty' }),
    act(name, el) {
      const t = L.tests[st.ti], bag = st.bags[st.ti];
      if (name === 'item') {
        const k = +el.dataset.k;
        if (bag.includes(k)) bag.splice(bag.indexOf(k), 1);
        else {
          const left = t.W - sum(st.ti, 'w');
          if (t.items[k].w > left) { toast(`装不下：${t.items[k].n}重 ${t.items[k].w} kg，背包只剩 ${left} kg`); buzz([20, 40, 20]); return; }
          bag.push(k);
          bag.sort((p, q) => p - q);
        }
        st.msg = null;
        buzz(6);
        settle();
      }
      if (name === 'greedy') {
        const g = el.dataset.g, score = it => (g === 'val' ? it.v : it.v / it.w);
        const order = t.items.map((_, k) => k).sort((p, q) => score(t.items[q]) - score(t.items[p]));
        const nb = [];
        let left = t.W;
        for (const k of order) if (t.items[k].w <= left) { nb.push(k); left -= t.items[k].w; }
        st.bags[st.ti] = nb.sort((p, q) => p - q);
        const v = sum(st.ti, 'v'), tg = target(st.ti);
        st.msg = { cls: v >= tg ? 'good' : 'bad', html: `按「${g === 'val' ? '最贵的先放' : '最划算的先放'}」依次看 ${order.map(k => t.items[k].n).join('、')}，装得下就装。结果装了${nb.map(k => t.items[k].n).join('、')}，价值 <b>${v}</b>。${v >= tg ? '正好达到目标。' : `比目标少 <b>${tg - v}</b>。`}` };
        buzz(10);
        settle();
      }
      if (name === 'empty') { st.bags[st.ti] = []; st.msg = null; persist(); refresh(); }
    },
  };
}

/* ================= mode: match (spot the disguise) ================= */

function matchMode(L, saved) {
  const st = { ans: { ...((saved && saved.ans) || {}) }, marks: {} };
  const picked = () => L.stories.filter(s => st.ans[s.id]).length;
  return {
    st,
    save: () => ({ ans: st.ans }),
    custom() {
      return `<div class="stories">${L.stories.map((s, k) => {
        const mark = st.marks[s.id];
        return `<article class="story${mark ? ` ${mark}` : ''}"><span class="eyebrow">故事 ${k + 1}${mark === 'ok' ? ' · 答对了' : mark === 'no' ? ' · 再想想' : ''}</span><p>${s.t}</p>
          <div class="mchips" role="radiogroup" aria-label="故事 ${k + 1} 用哪台机器">${L.options.map(o => `<button class="mchip" type="button" role="radio" aria-checked="${st.ans[s.id] === o.v}" data-act="pick" data-s="${s.id}" data-o="${o.v}">${o.l}</button>`).join('')}</div>
          ${mark === 'ok' ? `<p class="why">${s.why}</p>` : mark === 'no' ? `<p class="why no">${s.hint}</p>` : ''}</article>`;
      }).join('')}</div>`;
    },
    note: () => '',
    panel: () => `<div class="pcard"><h3>零件箱速查</h3><div class="list">${L.refs.map(([n, d]) => `<div class="ref"><b>${n}</b><span>${d}</span></div>`).join('')}</div></div>`,
    dock: () => ({ meta: `已选 <b>${picked()}</b> / ${L.stories.length}`, go: '检查', act: 'check', goIcon: ICON.check }),
    act(name, el) {
      if (name === 'pick') { st.ans[el.dataset.s] = el.dataset.o; delete st.marks[el.dataset.s]; persist(); buzz(5); refresh(); return; }
      if (name !== 'check') return;
      if (picked() < L.stories.length) { toast(`还有 ${L.stories.length - picked()} 个故事没选`); buzz(20); return; }
      L.stories.forEach(s => { st.marks[s.id] = st.ans[s.id] === s.a ? 'ok' : 'no'; });
      const wrong = L.stories.filter(s => st.marks[s.id] === 'no').length;
      refresh();
      if (!wrong) { buzz(15); setTimeout(pass, reduced() ? 0 : 700); return; }
      toast(`${L.stories.length - wrong} 个对了，还有 ${wrong} 个要再想想`);
      buzz([20, 40, 20]);
    },
  };
}

const MODES = { wire: wireMode, trace: traceMode, fill: fillMode, machine: machineMode, back: backMode, explode: explodeMode, lab: labMode, breach: breachMode, link: linkMode, pack: packMode, match: matchMode };

/* ================= level screen ================= */

function persist() { if (cur) { S.data[cur.L.id] = cur.ctl.save(); save(); } }

  if (cur && cur.running) Anim.skip();

const FOCUS_KEYS = ['act', 'c', 'j', 'k', 'r', 'g', 's', 'o', 'test'];
const focusSig = el => FOCUS_KEYS.map(k => el.dataset[k] || '').join('|');
function refresh() {
  if (!cur) return;
  const a = document.activeElement, sig = a && a.dataset && a.closest && a.closest('#panel, #board') && (a.dataset.act || a.dataset.test) ? focusSig(a) : null;

}
function refreshKeepRange() {

  $('#whyQ').hidden = cur.ctl.st.max < 30;
  renderDock();
}

function startRun() { cur.running = true; Anim.begin(); renderDock(); if (matchMedia('(max-width: 899px)').matches) $('#bcard').scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' }); }
function endRun() { cur.running = false; }

/* ================= sheets ================= */

let sheetActs = {};
function openSheet(html, acts = {}) {
  const root = $('#sheet');
  sheetActs = acts;
  $('#sheetBody').innerHTML = html;
  root.hidden = false;
  $('#sheetBody').scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  setTimeout(() => { const f = $('#sheetBody [data-primary]') || $('#sheetBody button:not(:disabled)'); if (f) f.focus({ preventScroll: true }); }, 80);
}
function closeSheet() {
  const root = $('#sheet');
  if (root.hidden) return;
  root.classList.remove('open');
  $('#sheetPanel').style.removeProperty('--dy');
  setTimeout(() => { if (!root.classList.contains('open')) root.hidden = true; }, reduced() ? 0 : 320);

function openIntro(page = 0) {
  const L = cur.L, pages = L.intro, p = pages[page], last = page === pages.length - 1;
  openSheet(`<div><div class="kicker sig">第 ${cur.i + 1} 关 · 原理 ${page + 1}/${pages.length}</div><h3 class="sh" id="sheetTitle">${L.title}</h3></div>
    ${p.fig ? `<div class="fig">${sceneSVG(p.fig, { pad: 12, maxScale: 1.3 })}</div>` : ''}
    <div class="prose"><p>${p.t}</p></div>
    <div class="dots" aria-hidden="true">${pages.map((_, k) => `<i class="${k === page ? 'on' : ''}"></i>`).join('')}</div>
    <div class="acts">${page ? '<button class="btn sec" type="button" data-act="prev">上一页</button>' : ''}<button class="btn pri" type="button" data-act="next" data-primary>${last ? '开始挑战' : '下一页'}</button></div>`, {
    prev: () => openIntro(page - 1),
    next: () => { if (last) { S.seen[L.id] = true; save(); closeSheet(); } else openIntro(page + 1); },
  });
}

function fail(x) {
  cur.fails++;
  buzz([30, 60, 30]);
  const L = cur.L, hint = x.hint !== undefined ? x.hint : L.hint ? L.hint() : null;
  const acts = x.cta ? { cta: () => { x.cta.fn(); closeSheet(); refresh(); } } : {};
  openSheet(`<div><div class="kicker bad">没通过</div><h3 class="sh" id="sheetTitle">${x.head}</h3></div>
    <div class="prose"><p>${x.body}</p></div>
    ${x.extra || ''}
    ${hint && cur.fails >= 2 ? `<p class="hint"><b>提示</b>${hint}</p>` : cur.fails < 2 && hint ? '<p class="msg">再失败一次，这里会出现提示。</p>' : ''}
    <div class="acts">${x.cta ? `<button class="btn pri" type="button" data-act="cta" data-primary>${x.cta.label}</button>` : ''}<button class="btn ${x.cta ? 'sec' : 'pri'}" type="button" data-close${x.cta ? '' : ' data-primary'}>回去改改</button></div>`, acts);
}

function partCard(k, tag) {
  const off = tag === '未获得';
  return `<div class="part${off ? ' off' : ''}"><span class="ic">${off ? ICON.lock : ICON.part}</span><small>${tag}</small><b>${PARTS[k].name}</b><span>${PARTS[k].desc}</span></div>`;
}

function pass() {
  const L = cur.L, i = cur.i, last = i === LEVELS.length - 1, fresh = L.unlock && !S.done[L.id];
  S.done[L.id] = true;
  save();
  buzz([15, 40, 15, 40, 60]);
  openSheet(`<div><div class="kicker good">第 ${i + 1} 关 · 完成</div><h3 class="sh" id="sheetTitle">${L.debrief.title}</h3></div>
    <div class="prose">${L.debrief.body.map(p => `<p>${p}</p>`).join('')}</div>
    <div class="note"><span>记进笔记本</span><p>${L.debrief.note}</p></div>
    ${L.unlock ? partCard(L.unlock, fresh ? '新零件' : '零件') : ''}
    <div class="acts"><button class="btn sec" type="button" data-act="map">回到地图</button><button class="btn pri" type="button" data-act="next" data-primary>${last ? '完成' : '下一关'}</button></div>`, {
    map: () => leaveLevel(),
    next: () => { if (last) leaveLevel(); else { closeSheet(); openLevel(i + 1); } },
  });
}

function openParts() {

    <div class="prose"><p>就像《图灵完备》里先造加法器、再用加法器造 CPU，这里每个零件都会在后面的关卡里被直接调用。</p></div>
    <div class="list">${Object.keys(PARTS).map(k => partCard(k, hasPart(k) ? '已获得' : '未获得')).join('')}</div>

function openNotes() {
  const done = LEVELS.filter(L => S.done[L.id]);
  openSheet(`<div><div class="kicker sig">笔记本</div><h3 class="sh" id="sheetTitle">每关一句话</h3></div>
    <div class="list">${done.length ? done.map(L => `<div class="nrow"><span class="eyebrow">第 ${LEVELS.indexOf(L) + 1} 关 · ${L.title}</span><p>${L.debrief.note}</p></div>`).join('') : '<div class="empty">还没有笔记。通过一关后，这一关的核心想法会记在这里。</div>'}</div>
    <div class="acts"><button class="btn sec" type="button" data-close>关闭</button></div>`);

function openSettings() {
  openSheet(`<div><div class="kicker sig">设置</div><h3 class="sh" id="sheetTitle">试玩选项</h3></div>
    <div class="setrow"><div><b>解锁全部关卡</b><p>可以直接跳到任意一关。</p></div><button class="switch" type="button" role="switch" aria-checked="${S.all}" aria-label="解锁全部关卡" data-act="all"></button></div>
    <div class="setrow"><div><b>清空进度</b><p>关卡进度、零件、笔记和棋盘上的操作都会被清空。</p></div><button class="danger" type="button" data-act="reset">清空</button></div>
    <div class="acts"><button class="btn sec" type="button" data-close>关闭</button></div>`, {
    all: el => { S.all = !S.all; save(); el.setAttribute('aria-checked', String(S.all)); renderMap(); },
    reset: el => {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = '再点一次确认'; return; }
      Object.assign(S, { done: {}, seen: {}, data: {}, all: false });
      save();
      closeSheet();

function wireSheetDrag() {
  const panel = $('#sheetPanel'), grab = $('#grab');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; panel.classList.add('dragging'); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); panel.style.setProperty('--dy', `${dy}px`); });
  const end = () => { if (y0 === null) return; y0 = null; panel.classList.remove('dragging'); if (dy > 90) closeSheet(); else panel.style.removeProperty('--dy'); };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
}

/* ================= map ================= */

function status(i) {
  if (S.done[LEVELS[i].id]) return 'done';
  if (i === 0 || S.all || S.done[LEVELS[i - 1].id]) return 'open';
  return 'locked';
}

function renderMap() {
  const next = LEVELS.findIndex((_, i) => status(i) === 'open');
  $('#chapters').innerHTML = CHAPTERS.map((ch, c) => `<section class="chapter"><div class="ch-head"><span class="ch-num">第 ${c + 1} 章</span><h2>${ch.name}</h2><p>${ch.desc}</p></div>
    <div class="lgrid">${LEVELS.map((L, i) => [L, i]).filter(([L]) => L.ch === c).map(([L, i]) => {
      const st = status(i);
      return `<button class="lcard ${st}${i === next ? ' next' : ''}" type="button" data-level="${i}" ${st === 'locked' ? 'aria-disabled="true"' : ''}>
        <span class="no">第 ${i + 1} 关</span><span class="tt">${L.title}</span><span class="ds">${L.short}</span>
        ${L.unlock ? `<span class="pt">产出零件 · ${PARTS[L.unlock].name}</span>` : ''}
        <span class="st">${st === 'done' ? '已完成' : i === next ? '下一关' : st === 'locked' ? '未解锁' : '可挑战'}</span></button>`;
    }).join('')}</div></section>`).join('');
  $('#partCount').textContent = `${Object.keys(PARTS).filter(hasPart).length}/${Object.keys(PARTS).length}`;
  $('#noteCount').textContent = String(LEVELS.filter(L => S.done[L.id]).length);
  $('#banner').innerHTML = LEVELS.every(L => S.done[L.id]) ? '<div class="banner"><b>全部通关</b><span>只看最后一步，用小问题的答案拼出大问题，按顺序记在表里，绝不重复计算。这就是动态规划。</span></div>' : '';
}

async function heroLoop() {
  const R = 3, C = 5, w = { kind: 'grid', R, C }, res = runMachine(w, { stencil: ['u', 'l'], op: 'sum', start: 1, order: 'colL', addCost: false });
  const el = $('#heroBoard');
  const draw = k => {
    const shown = new Map(res.steps.slice(0, k).map(s => [s.id, s.v])), now = res.steps[k - 1];
    const sc = gridScene(R, C, {
      cell: (r, c) => { const id = `${r},${c}`; return { value: shown.has(id) ? shown.get(id) : '', cls: now && now.id === id && k < res.steps.length ? 'hot' : shown.has(id) ? 'lit' : '' }; },
      edge: (a, b) => (now && now.id === b && k < res.steps.length ? 'hot' : 'dim'),
    });
    el.innerHTML = sceneSVG(sc, { pad: 8, label: '路线数随着箭头从左上流到右下' });
  };
  if (reduced()) { draw(res.steps.length); return; }
  for (;;) {
    if ($('#map').hidden) { await sleep(1000); continue; }
    for (let k = 0; k <= res.steps.length; k++) { draw(k); await sleep(k === 0 ? 600 : 330); }
    await sleep(3200);
  }
}

/* ================= boot ================= */

function boot() {
  $('#btnBack').innerHTML = ICON.back;
  $('#btnSettings').innerHTML = ICON.gear;
  $('#chapters').addEventListener('click', e => {
    const b = e.target.closest('[data-level]');
    if (!b) return;
    const i = +b.dataset.level;
    if (status(i) === 'locked') { toast('先通过上一关，或在设置里解锁全部关卡'); buzz(15); return; }
    openLevel(i);
  });
  $('#btnParts').addEventListener('click', openParts);
  $('#btnNotes').addEventListener('click', openNotes);
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnBack').addEventListener('click', leaveLevel);
  $('#btnIntro').addEventListener('click', () => openIntro(0));
  const onCell = e => { const g = e.target.closest('[data-cell]'); if (g && cur && cur.ctl.onCell) cur.ctl.onCell(g.dataset.cell); };
  $('#board').addEventListener('click', e => { if (e.target.closest('[data-cell]')) onCell(e); else onAct(e); });
  $('#board').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCell(e); } });
  $('#tests').addEventListener('click', e => { const b = e.target.closest('[data-test]'); if (b && !cur.running) cur.ctl.selectTest(+b.dataset.test); });
  const onAct = e => { const a = e.target.closest('[data-act]'); if (a && cur && cur.ctl.act && !a.disabled) cur.ctl.act(a.dataset.act, a); };
  $('#panel').addEventListener('click', onAct);
  $('#panel').addEventListener('input', e => { if (e.target.id === 'nRange' && cur.ctl.input) cur.ctl.input(+e.target.value); });
  $('#dock').addEventListener('click', e => {
    const k = e.target.closest('[data-key]');
    if (k) { if (k.dataset.key === 'close') { cur.ctl.st.sel = null; refresh(); } else cur.ctl.key(k.dataset.key); return; }
    onAct(e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (cur) leaveLevel(); return; }
    if (cur && cur.ctl.key && cur.ctl.st.sel && $('#sheet').hidden && !e.target.closest('button,input')) {
      if (/^[0-9]$/.test(e.key)) cur.ctl.key(e.key);
      else if (e.key === 'Backspace') cur.ctl.key('del');
      else if (e.key === 'Enter') cur.ctl.key('ok');
    }
  });
  $('#sheet').addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    const a = e.target.closest('[data-act]');
    if (a && sheetActs[a.dataset.act]) sheetActs[a.dataset.act](a);
  });
  wireSheetDrag();
  renderMap();
  heroLoop();

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ level: cur ? cur.i : null }));
  const start = d => { if (d && Number.isInteger(d.level)) openLevel(d.level); };
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
}

boot();
</script>
</body>
</html>
