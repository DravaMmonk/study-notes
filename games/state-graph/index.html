<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="零基础动态规划解谜游戏：27 关从格子和箭头出发，用元件亲手拼出路线计数器、分层状态机、对齐表和背包表的电路。">
<meta name="theme-color" content="#F3F1EB">
<title>状态之图</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/ui.css">
<link rel="stylesheet" href="../kit/wires.css">
<link rel="stylesheet" href="styles.css">
<script>try{const t=localStorage.getItem("fieldnotes.theme");document.documentElement.dataset.theme=["paper","night","blueprint"].includes(t)?t:matchMedia("(prefers-color-scheme: dark)").matches?"night":"paper"}catch(e){document.documentElement.dataset.theme="paper"}
try{const l=localStorage.getItem("fieldnotes.lang");document.documentElement.lang=(l==="zh"||l==="en"?l:/^zh\b/i.test(navigator.language||"")?"zh":"en")==="zh"?"zh-CN":"en"}catch(e){document.documentElement.lang=/^zh\b/i.test(navigator.language||"")?"zh-CN":"en"}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <section id="map" class="screen">
    <header class="kit-bar">
      <a class="kit-btn is-label" href="../" data-en="← Games">← 游戏</a>
      <span class="kit-brand"><i class="kit-chip"></i><span data-en="State Graph">状态之图</span></span>
      <nav class="kit-nav" aria-label="站点" data-en-label="Site">
        <a href="../../" data-en="Notes">笔记</a>
        <a href="../" aria-current="page" data-en="Games">游戏</a>
      </nav>
      <div class="kit-actions">
        <button class="kit-btn" type="button" data-lang-toggle></button>
        <button class="kit-btn" type="button" data-theme-toggle></button>
      </div>
    </header>
    <div class="scroll">
      <div class="wrap gutter">
        <header class="hero">
          <div>
            <div class="eyebrow" data-en="Dynamic programming puzzles, from scratch">从零开始的动态规划解谜</div>
            <h1 class="title" data-en="State <em>Graph</em>">状态之<em>图</em></h1>
            <p class="lede" data-en="No programming or algorithms background needed. You get just two kinds of pieces: cells and arrows. Over 27 levels you wire up, part by part, the circuit boards that count routes, compare words and pack a backpack, and find out why they are so fast.">不需要任何编程或算法基础。你只会拿到两种零件：格子和箭头。27 关里，你会用元件亲手拼出数路线、比文字、装背包的电路板，并且明白它们为什么这么快。</p>
          </div>
          <figure class="hero-fig">
            <div id="heroBoard"></div>
            <figcaption data-en="Each cell = the sum of the numbers its incoming arrows bring. Numbers flow from the top-left corner to the bottom-right.">每个格子 = 指向它的箭头送来的数之和。数从左上角流向右下角。</figcaption>
          </figure>
        </header>
        <div class="toolbar">
          <button class="pill" id="btnParts" type="button"><span data-en="Parts">零件箱</span> <b id="partCount"></b></button>
          <button class="pill" id="btnNotes" type="button"><span data-en="Notebook">笔记本</span> <b id="noteCount"></b></button>
          <button class="pill icon" id="btnSettings" type="button" aria-label="设置" data-en-label="Settings"></button>
        </div>
        <div id="banner"></div>
        <div id="chapters" style="display:grid;gap:30px"></div>
        <p class="foot" data-en="The design borrows from <i>Turing Complete</i>: start from the smallest pieces, add just one new idea per level, and the boards you build become components in later levels.">设计思路借鉴《图灵完备》：从最小的零件出发，每一关只多一个新想法，前面拼好的电路板会变成后面的元件。</p>
      </div>
    </div>
  </section>

  <section id="level" class="screen" hidden>
    <header class="kit-bar lv-top gutter">
      <button class="iconbtn" id="btnBack" type="button" aria-label="返回关卡地图" data-en-label="Back to the level map"></button>
      <button class="iconbtn desk" id="btnRail" type="button" aria-label="关卡列表" data-en-label="Level list" aria-expanded="false"></button>
      <span class="kit-brand desk"><i class="kit-chip"></i><span data-en="State Graph">状态之图</span></span>
      <div class="lv-titles"><div class="eyebrow" id="lvCh"></div><h2 id="lvTitle"></h2></div>
      <button class="introbtn" id="btnIntro" type="button" data-en="Intro">引入</button>
      <div class="kit-actions desk">
        <button class="kit-btn" type="button" data-lang-toggle></button>
        <button class="kit-btn" type="button" data-theme-toggle></button>
      </div>
    </header>
    <nav class="rail" id="rail" aria-label="关卡列表" data-en-label="Level list"></nav>
    <div class="rail-scrim" id="railScrim"></div>
    <div class="lv-scroll" id="lvScroll">
      <div class="lv-grid gutter">
        <aside class="brief" id="brief">
          <section class="mission" id="mission" aria-label="任务" data-en-label="Mission"></section>
          <section class="parts" id="parts" aria-label="元件" data-en-label="Components" data-trash></section>
        </aside>
        <section class="bcard" id="bcard" aria-label="棋盘" data-en-label="Board">
          <div class="tests" id="tests" role="tablist" aria-label="测试" data-en-label="Tests"></div>
          <div class="board" id="board"></div>
          <p class="bnote" id="bnote"></p>
          <div id="view"></div>
          <div id="after"></div>
        </section>
        <div class="panel" id="panel"></div>
      </div>
    </div>
    <footer class="dock gutter" id="dock"></footer>
  </section>
</div>

<div id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" id="grab"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
