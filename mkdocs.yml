site_name: Drava's Study Notes

theme:
  name: material
  custom_dir: overrides
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - diagrams

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

hooks:
  - hooks/games.py
  - hooks/i18n.py

plugins:
  - search
  - awesome-pages
  - tags
  - offline
  - obsidian-support

extra_javascript:
  - javascripts/site.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# The shared kit lives in games/kit and is published at game/kit/ (hooks/games.py).
extra_css:
  - game/kit/tokens.css
  - game/kit/ui.css
  - game/kit/prose.css
  - stylesheets/extra.css

extra:
  manifest: assets/manifest.webmanifest
