site_name: Drava's Study Notes
site_url: https://dravammonk.github.io/study-notes/

# Git ignore rules do not control MkDocs output.
exclude_docs: |
  /Unimelb/**/lecture/
  /Unimelb/**/transcript/
  /Unimelb/**/workshop/
  /Unimelb/**/tutorial/
  /Unimelb/**/readings/
  /Unimelb/**/assignment/
  /Unimelb/**/exam/
  /Unimelb/**/assets/
  /Unimelb/**/Screenshot*
  *.[pP][dD][fF]
  *.[pP][pP][tT]
  *.[pP][pP][tT][xX]
  *.[pP][pP][sS]
  *.[pP][pP][sS][xX]

theme:
  name: material
  custom_dir: overrides
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - diagrams

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

hooks:
  - hooks/ui.py
  - hooks/i18n.py

plugins:
  - search
  - awesome-pages
  - tags
  - offline
  - obsidian-support

extra_javascript:
  - javascripts/site.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# The notes package only their shared UI assets (hooks/ui.py).
extra_css:
  - assets/kit/tokens.css
  - assets/kit/ui.css
  - assets/kit/prose.css
  - stylesheets/extra.css

extra:
  manifest: assets/manifest.webmanifest
