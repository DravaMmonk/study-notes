# Publish the standalone games site to /games/; keep source in study-notes. Game content is checked where it is
# changed (the studio and the operation set), and kit code by test-kit.yml: this workflow only builds and publishes.
name: Deploy games

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      # Design notes and specs are not on the site; the kit's own Markdown is read by its code.
      - '!games/**/*.md'
      - 'games/kit/**/*.md'
      - 'trace-viewer/**'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-games
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trace-viewer/package-lock.json
      - run: npm ci
      - run: npm run build:games
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GAMES_DEPLOY_KEY }}
          external_repository: DravaMmonk/games
          publish_branch: gh-pages
          publish_dir: trace-viewer/dist-games
          commit_message: 'deploy: games'
