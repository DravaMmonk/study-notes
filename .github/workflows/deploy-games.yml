# Publish the games to GitHub Pages at /study-notes/game/: the hub and the shared kit from games/, and both games
# built from trace-viewer/ on the shared game shell (games/kit/shell): Vision Complete into game/vision-complete/,
# 状态之图 into game/state-graph/. With destination_dir
# the action only replaces the game/ folder on gh-pages; the MkDocs hook hooks/games.py assembles the same folder
# into every notes build, so a notes deploy keeps it.
name: Deploy games

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'trace-viewer/**'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-games
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trace-viewer/package-lock.json
      - run: npm ci
        working-directory: trace-viewer
      - run: npm run levels
        working-directory: trace-viewer
      - run: npm run build:game
        working-directory: trace-viewer
      - run: npm run build:state-graph
        working-directory: trace-viewer
      - name: Assemble game/
        run: |
          mkdir -p _site
          cp -r games/. _site/
          rm -rf _site/state-graph
          cp -r trace-viewer/dist-state-graph _site/state-graph
          cp -r trace-viewer/dist-game _site/vision-complete
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: game
          commit_message: 'deploy: games'
