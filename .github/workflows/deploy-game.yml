# Publish Vision Complete (the game in trace-viewer) to GitHub Pages at /study-notes/game/.
# The notes are published to the same gh-pages branch by `mkdocs gh-deploy`, so this only replaces
# the game/ folder (with destination_dir the action only clears that folder). The MkDocs hook in hooks/ copies the game
# into the notes build too, so a notes deploy does not drop it.
name: Deploy game

on:
  push:
    branches: [main]
    paths:
      - 'trace-viewer/**'
      - '.github/workflows/deploy-game.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trace-viewer/package-lock.json
      - run: npm ci
      - run: npm run levels
      - run: npm run build:game
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: trace-viewer/dist-game
          destination_dir: game
          commit_message: 'deploy: Vision Complete'
