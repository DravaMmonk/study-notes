# Publish only the notes to /study-notes/. Games have their own deployment.
name: Deploy notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'games/kit/tokens.css'
      - 'games/kit/ui.css'
      - 'games/kit/prose.css'
      - 'games/kit/menu.js'
      - 'games/kit/lang.js'
      - 'games/kit/theme.js'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          commit_message: 'deploy: notes'
